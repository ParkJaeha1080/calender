<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Windows 11 Family Calendar</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        "Segoe UI",
        "Malgun Gothic",
        system-ui,
        sans-serif;
}

body {
    background:
        radial-gradient(
            circle at 20% 10%,
            #3b82f6 0,
            #172554 28%,
            #08111f 70%
        );

    color: #fff;
}

/* =========================================================
   DESKTOP
========================================================= */

#desktop {
    position: fixed;
    inset: 0 0 48px 0;
    overflow: hidden;
}

.desktop-icon {
    position: absolute;

    width: 90px;
    min-height: 84px;

    padding: 8px 4px;

    border-radius: 10px;

    display: flex;
    flex-direction: column;
    align-items: center;

    justify-content: center;

    cursor: default;

    user-select: none;

    touch-action: none;
}

.desktop-icon:hover {
    background: rgba(255,255,255,.12);
}

.desktop-icon.selected {
    background: rgba(255,255,255,.18);
}

.icon-image {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;

    margin-bottom: 5px;
}

.icon-label {
    font-size: 12px;

    text-align: center;

    text-shadow:
        0 1px 3px rgba(0,0,0,.7);
}

/* =========================================================
   TASKBAR
========================================================= */

#taskbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    height: 48px;

    background:
        rgba(20,25,35,.78);

    backdrop-filter: blur(22px);

    border-top:
        1px solid rgba(255,255,255,.12);

    display: flex;
    align-items: center;

    z-index: 10000;
}

.taskbar-left {
    width: 16px;
}

.taskbar-center {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 4px;
}

.taskbar-right {
    display: flex;
    align-items: center;

    padding-right: 12px;

    gap: 10px;
}

.task-button {
    width: 40px;
    height: 40px;

    border: 0;
    background: transparent;

    color: white;

    border-radius: 8px;

    font-size: 20px;

    cursor: pointer;
}

.task-button:hover {
    background: rgba(255,255,255,.12);
}

.task-button.active {
    background: rgba(255,255,255,.18);
}

.connection {
    font-size: 11px;

    opacity: .9;
}

.clock {
    min-width: 72px;

    text-align: right;

    font-size: 11px;
}

/* =========================================================
   WINDOWS
========================================================= */

.window {
    position: absolute;

    left: 180px;
    top: 70px;

    width: 760px;
    height: 620px;

    min-width: 330px;
    min-height: 300px;

    display: none;
    flex-direction: column;

    background:
        rgba(28,32,40,.84);

    backdrop-filter: blur(30px);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 14px;

    box-shadow:
        0 24px 80px rgba(0,0,0,.45);

    overflow: hidden;

    z-index: 100;

    /* 드래그/리사이즈 시 브라우저 제스처 방지 */
    touch-action: none;
}

.window.visible {
    display: flex;
}

.window.maximized {
    left: 8px !important;
    top: 8px !important;

    width: calc(100vw - 16px) !important;
    height: calc(100vh - 64px) !important;
}

/* =========================================================
   TITLEBAR
========================================================= */

.titlebar {
    height: 44px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding-left: 16px;

    background:
        rgba(255,255,255,.04);

    border-bottom:
        1px solid rgba(255,255,255,.08);

    cursor: move;

    user-select: none;

    touch-action: none;
}

.title {
    flex: 1;

    font-size: 13px;

    font-weight: 500;
}

.window-controls {
    display: flex;
    height: 100%;

    touch-action: auto;
}

.window-control {
    width: 46px;

    border: 0;

    background: transparent;

    color: white;

    font-size: 14px;

    cursor: pointer;

    touch-action: auto;
}

.window-control:hover {
    background: rgba(255,255,255,.1);
}

.window-control.close:hover {
    background: #c42b1c;
}

/* =========================================================
   WINDOW CONTENT
========================================================= */

.window-content {
    flex: 1;

    min-height: 0;

    overflow: auto;

    padding: 18px;

    /*
       중요:
       콘텐츠 영역 자체는 일반 스크롤/입력을 허용
    */
    touch-action: pan-x pan-y;
}

/* =========================================================
   RESIZE HANDLE
========================================================= */

.window-resize-handle {
    position: absolute;

    right: 0;
    bottom: 0;

    width: 26px;
    height: 26px;

    cursor: nwse-resize;

    z-index: 100;

    touch-action: none;
}

/* 작은 Windows 스타일 resize 표시 */

.window-resize-handle::before,
.window-resize-handle::after {
    content: "";

    position: absolute;

    right: 5px;
    bottom: 5px;

    height: 2px;

    background:
        rgba(255,255,255,.55);

    border-radius: 2px;

    transform: rotate(-45deg);

    transform-origin: right center;

    opacity: .45;

    transition:
        opacity .15s,
        background .15s;
}

.window-resize-handle::before {
    width: 8px;

    bottom: 7px;
}

.window-resize-handle::after {
    width: 13px;

    bottom: 12px;
}

.window-resize-handle:hover::before,
.window-resize-handle:hover::after {
    opacity: .95;

    background:
        rgba(255,255,255,.9);
}

/* 최대화하면 resize 불가능 */

.window.maximized .window-resize-handle {
    display: none;
}

/* =========================================================
   CALENDAR
========================================================= */

.calendar-toolbar {
    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 16px;
}

.calendar-title {
    flex: 1;

    font-size: 22px;

    font-weight: 600;
}

.btn {
    border: 1px solid rgba(255,255,255,.13);

    background:
        rgba(255,255,255,.08);

    color: white;

    border-radius: 8px;

    padding: 8px 12px;

    cursor: pointer;

    touch-action: auto;
}

.btn:hover {
    background:
        rgba(255,255,255,.15);
}

.btn.primary {
    background: #1677ff;
    border-color: #1677ff;
}

.btn.primary:hover {
    background: #358cff;
}

.calendar-week {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0,1fr));

    margin-bottom: 5px;
}

.weekday {
    text-align: center;

    font-size: 12px;

    opacity: .65;

    padding: 5px;
}

.calendar-grid {
    display: grid;

    grid-template-columns:
        repeat(7, minmax(0,1fr));

    grid-auto-rows: minmax(78px,1fr);

    gap: 5px;
}

.day {
    position: relative;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.045);

    border-radius: 9px;

    padding: 7px;

    cursor: pointer;

    overflow: hidden;

    touch-action: auto;
}

.day:hover {
    background:
        rgba(255,255,255,.10);
}

.day.other-month {
    opacity: .35;
}

.day.today {
    border-color:
        #4da3ff;
}

.day-number {
    font-size: 12px;

    font-weight: 600;
}

.event-list {
    margin-top: 5px;

    display: flex;
    flex-direction: column;

    gap: 3px;
}

.event-item {
    font-size: 10px;

    background:
        rgba(43,132,255,.72);

    border-radius: 4px;

    padding: 3px 5px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    cursor: pointer;

    touch-action: auto;
}

.event-item:hover {
    background:
        rgba(70,150,255,.95);
}

/* =========================================================
   AI
========================================================= */

.ai-layout {
    height: 100%;

    display: flex;
    flex-direction: column;
}

.ai-messages {
    flex: 1;

    overflow-y: auto;

    padding: 4px;

    display: flex;
    flex-direction: column;

    gap: 10px;

    touch-action: pan-y;
}

.message {
    max-width: 82%;

    padding: 10px 12px;

    border-radius: 12px;

    font-size: 13px;

    line-height: 1.45;

    white-space: pre-wrap;
}

.message.ai {
    align-self: flex-start;

    background:
        rgba(255,255,255,.08);
}

.message.user {
    align-self: flex-end;

    background:
        #1677ff;
}

.ai-input {
    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.ai-input input {
    flex: 1;
}

/* =========================================================
   FORMS
========================================================= */

input,
textarea,
select {
    width: 100%;

    border:
        1px solid rgba(255,255,255,.14);

    background:
        rgba(0,0,0,.25);

    color: white;

    border-radius: 8px;

    padding: 10px;

    outline: none;

    font-family: inherit;

    touch-action: auto;
}

select option {
    background: #20242c;
}

textarea {
    resize: vertical;

    min-height: 90px;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #4da3ff;
}

.form-row {
    margin-bottom: 14px;
}

.form-label {
    font-size: 12px;

    opacity: .7;

    margin-bottom: 6px;
}

.share-list {
    display: flex;
    flex-direction: column;

    gap: 7px;

    max-height: 150px;

    overflow-y: auto;

    touch-action: pan-y;
}

.share-member {
    display: flex;
    align-items: center;

    gap: 8px;

    padding: 8px;

    border-radius: 7px;

    background:
        rgba(255,255,255,.05);

    touch-action: auto;
}

.share-member input {
    width: auto;
}

/* =========================================================
   MODALS
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.42);

    backdrop-filter: blur(5px);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 20000;

    padding: 20px;
}

.modal.visible {
    display: flex;
}

.modal-box {
    width: min(500px, 100%);

    max-height: 90vh;

    overflow: auto;

    background:
        rgba(31,35,43,.96);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 16px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);

    padding: 22px;
}

.modal-title {
    font-size: 20px;

    font-weight: 600;

    margin-bottom: 18px;
}

.modal-actions {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 18px;
}

/* =========================================================
   LOGIN
========================================================= */

#authScreen {
    position: fixed;

    inset: 0;

    z-index: 30000;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 20%,
            #2563eb,
            #111827 65%
        );

    padding: 20px;
}

#authScreen.visible {
    display: flex;
}

.auth-box {
    width: min(420px, 100%);

    background:
        rgba(20,24,32,.88);

    backdrop-filter: blur(30px);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 18px;

    padding: 28px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.5);
}

.auth-logo {
    font-size: 46px;

    text-align: center;

    margin-bottom: 8px;
}

.auth-title {
    text-align: center;

    font-size: 24px;

    font-weight: 600;
}

.auth-subtitle {
    text-align: center;

    opacity: .6;

    font-size: 12px;

    margin-top: 5px;

    margin-bottom: 24px;
}

.auth-error {
    background:
        rgba(220,38,38,.18);

    border:
        1px solid rgba(248,113,113,.3);

    color: #fecaca;

    padding: 9px;

    border-radius: 8px;

    font-size: 12px;

    margin-bottom: 12px;

    display: none;
}

.auth-error.visible {
    display: block;
}

.auth-switch {
    margin-top: 15px;

    text-align: center;

    font-size: 12px;

    opacity: .7;
}

.auth-switch button {
    border: 0;

    background: transparent;

    color: #67b0ff;

    cursor: pointer;
}

/* =========================================================
   SETTINGS
========================================================= */

.member-row {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px;

    border-radius: 8px;

    background:
        rgba(255,255,255,.05);

    margin-bottom: 7px;
}

.member-info {
    flex: 1;
}

.member-name {
    font-size: 13px;
}

.member-email {
    font-size: 10px;

    opacity: .5;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #desktop {
        inset: 0 0 48px 0;
    }

    .desktop-icon {
        width: 74px;
    }

    /*
       !important 제거.
       JS resize가 모바일에서도 작동하도록 함.
    */

    .window {
        left: 8px;
        top: 8px;

        width: calc(100vw - 16px);
        height: calc(100vh - 64px);

        border-radius: 14px;
    }

    .calendar-grid {
        grid-auto-rows: 70px;

        gap: 3px;
    }

    .window-content {
        padding: 10px;
    }

    .calendar-title {
        font-size: 18px;
    }

    .calendar-toolbar {
        flex-wrap: wrap;
    }

    .event-item {
        font-size: 8px;
    }

    .taskbar-center {
        gap: 1px;
    }

    .taskbar-right {
        padding-right: 5px;
    }

    .clock {
        min-width: 60px;
    }

    .window-resize-handle {
        width: 30px;
        height: 30px;
    }
}

</style>
</head>

<body>

<!-- =======================================================
     DESKTOP
======================================================== -->

<div id="desktop">

    <div
        class="desktop-icon"
        data-app="calendar"
        style="left:20px;top:20px"
    >
        <div class="icon-image">📅</div>
        <div class="icon-label">캘린더</div>
    </div>

    <div
        class="desktop-icon"
        data-app="ai"
        style="left:20px;top:120px"
    >
        <div class="icon-image">🤖</div>
        <div class="icon-label">AI 비서</div>
    </div>

    <div
        class="desktop-icon"
        data-app="family"
        style="left:20px;top:220px"
    >
        <div class="icon-image">👨‍👩‍👧</div>
        <div class="icon-label">가족</div>
    </div>

</div>

<!-- =======================================================
     CALENDAR WINDOW
======================================================== -->

<div
    class="window"
    id="calendarWindow"
>

    <div class="titlebar">

        <div class="title">
            📅 가족 캘린더
        </div>

        <div class="window-controls">

            <button
                class="window-control"
                data-minimize="calendarWindow"
            >─</button>

            <button
                class="window-control"
                data-maximize="calendarWindow"
            >□</button>

            <button
                class="window-control close"
                data-close="calendarWindow"
            >×</button>

        </div>

    </div>

    <div class="window-content">

        <div class="calendar-toolbar">

            <button
                class="btn"
                id="prevMonth"
            >‹</button>

            <div
                class="calendar-title"
                id="calendarTitle"
            ></div>

            <button
                class="btn"
                id="todayButton"
            >오늘</button>

            <button
                class="btn"
                id="nextMonth"
            >›</button>

        </div>

        <div class="calendar-week">

            <div class="weekday">일</div>
            <div class="weekday">월</div>
            <div class="weekday">화</div>
            <div class="weekday">수</div>
            <div class="weekday">목</div>
            <div class="weekday">금</div>
            <div class="weekday">토</div>

        </div>

        <div
            class="calendar-grid"
            id="calendarGrid"
        ></div>

    </div>

    <!-- RESIZE HANDLE -->
    <div class="window-resize-handle"></div>

</div>

<!-- =======================================================
     AI WINDOW
======================================================== -->

<div
    class="window"
    id="aiWindow"
>

    <div class="titlebar">

        <div class="title">
            🤖 AI 가족 비서
        </div>

        <div class="window-controls">

            <button
                class="window-control"
                data-minimize="aiWindow"
            >─</button>

            <button
                class="window-control"
                data-maximize="aiWindow"
            >□</button>

            <button
                class="window-control close"
                data-close="aiWindow"
            >×</button>

        </div>

    </div>

    <div class="window-content">

        <div class="ai-layout">

            <div
                class="ai-messages"
                id="aiMessages"
            ></div>

            <div class="ai-input">

                <input
                    id="aiInput"
                    placeholder="예: 내일 오후 3시에 가족 회의 추가해줘"
                >

                <button
                    class="btn primary"
                    id="aiSend"
                >
                    보내기
                </button>

            </div>

        </div>

    </div>

    <!-- RESIZE HANDLE -->
    <div class="window-resize-handle"></div>

</div>

<!-- =======================================================
     TASKBAR
======================================================== -->

<div id="taskbar">

    <div class="taskbar-left"></div>

    <div class="taskbar-center">

        <button
            class="task-button"
            id="calendarTask"
        >📅</button>

        <button
            class="task-button"
            id="aiTask"
        >🤖</button>

        <button
            class="task-button"
            id="familyTask"
        >👨‍👩‍👧</button>

    </div>

    <div class="taskbar-right">

        <div
            class="connection"
            id="connectionStatus"
        >
            ● 연결 중
        </div>

        <div
            class="clock"
            id="clock"
        ></div>

    </div>

</div>

<!-- =======================================================
     EVENT MODAL
======================================================== -->

<div
    class="modal"
    id="eventModal"
>

    <div class="modal-box">

        <div
            class="modal-title"
            id="eventModalTitle"
        >
            일정 추가
        </div>

        <input
            type="hidden"
            id="eventId"
        >

        <div class="form-row">

            <div class="form-label">
                일정 이름
            </div>

            <input
                id="eventTitle"
                placeholder="예: 가족 외식"
            >

        </div>

        <div class="form-row">

            <div class="form-label">
                날짜
            </div>

            <input
                type="date"
                id="eventDate"
            >

        </div>

        <div class="form-row">

            <div class="form-label">
                시간
            </div>

            <input
                type="time"
                id="eventTime"
            >

        </div>

        <div class="form-row">

            <div class="form-label">
                설명
            </div>

            <textarea
                id="eventDescription"
                placeholder="설명을 입력하세요."
            ></textarea>

        </div>

        <div class="form-row">

            <div class="form-label">
                누구와 공유할까요?
            </div>

            <div
                class="share-list"
                id="shareList"
            ></div>

        </div>

        <div class="modal-actions">

            <button
                class="btn"
                id="eventCancel"
            >
                취소
            </button>

            <button
                class="btn"
                id="eventDelete"
                style="display:none"
            >
                삭제
            </button>

            <button
                class="btn primary"
                id="eventSave"
            >
                저장
            </button>

        </div>

    </div>

</div>

<!-- =======================================================
     FAMILY MODAL
======================================================== -->

<div
    class="modal"
    id="familyModal"
>

    <div class="modal-box">

        <div class="modal-title">
            👨‍👩‍👧 가족
        </div>

        <div class="form-row">

            <div class="form-label">
                현재 계정
            </div>

            <div id="currentAccount"></div>

        </div>

        <div class="form-row">

            <div class="form-label">
                가족 구성원
            </div>

            <div id="memberList"></div>

        </div>

        <div class="form-row">

            <div class="form-label">
                내 이름
            </div>

            <input
                id="myNameInput"
                placeholder="예: 홍길동"
            >

        </div>

        <div class="modal-actions">

            <button
                class="btn"
                id="familyClose"
            >
                닫기
            </button>

            <button
                class="btn"
                id="logoutButton"
            >
                로그아웃
            </button>

            <button
                class="btn primary"
                id="saveMyName"
            >
                저장
            </button>

        </div>

    </div>

</div>

<!-- =======================================================
     SETTINGS MODAL
======================================================== -->

<div
    class="modal"
    id="setupModal"
>

    <div class="modal-box">

        <div class="modal-title">
            ⚙️ Supabase 설정
        </div>

        <div class="form-row">

            <div class="form-label">
                Supabase URL
            </div>

            <input
                id="supabaseUrl"
                placeholder="https://xxxxxxxx.supabase.co"
            >

        </div>

        <div class="form-row">

            <div class="form-label">
                Publishable / Anon Key
            </div>

            <input
                id="supabaseKey"
                placeholder="sb_publishable_... 또는 anon key"
            >

        </div>

        <div class="form-row">

</div>

<div id="authScreen">

    <div class="auth-box">

        <div class="auth-logo">
            🪟
        </div>

        <div class="auth-title">
            Family Calendar

        <div
            class="auth-subtitle"
            id="authSubtitle"
        >

        </div>

        <div

        ></div>

        <div

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

const STORAGE = {

    supabaseUrl:
        "windows11_supabase_url",

    supabaseKey:
        "windows11_supabase_key",

    geminiKey:
        "windows11_gemini_key",

    iconPositions:
        "windows11_family_calendar_icons",

    calendarMonth:
        "windows11_calendar_month"

};

let supabaseClient = null;

let currentUser = null;

let currentMember = null;

let members = [];

let events = [];

let currentDate = new Date();

let selectedDate = null;

let authMode = "login";

let highestZ = 200;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function showModal(id) {

    $(id)
        .classList
        .add("visible");
}


function hideModal(id) {

    $(id)
        .classList
        .remove("visible");
}


function setStatus(text) {

    $("connectionStatus")
        .textContent = text;
}


/* =========================================================
   SUPABASE INIT
========================================================= */

async function initSupabase() {

    const url =
        localStorage.getItem(
            STORAGE.supabaseUrl
        );

    const key =
        localStorage.getItem(
            STORAGE.supabaseKey
        );

    if (!url || !key) {

        showModal("setupModal");

        return false;
    }

    try {

        const {
            createClient
        } = window.supabase;

        supabaseClient =
            createClient(
                url,
                key,
                {
                    auth: {
                        autoRefreshToken: true,
                        persistSession: true,
                        detectSessionInUrl: true
                    }
                }
            );

        setStatus(
            "● Supabase 연결됨"
        );

        return true;

    } catch(error) {

        console.error(error);

        alert(
            "Supabase 연결에 실패했습니다.\n\n" +
            error.message
        );

        showModal(
            "setupModal"
        );

        return false;
    }
}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth() {

    if (!supabaseClient) return;

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();

    if (error) {

        console.error(error);

        return;
    }

    currentUser =
        data.session?.user ||
        null;

    if (!currentUser) {

        $("authScreen")
            .classList
            .add("visible");

        return;
    }

    $("authScreen")
        .classList
        .remove("visible");

    await loadMembers();

    await loadEvents();

    subscribeRealtime();

    renderCalendar();

    addAIMessage(
        "안녕하세요! 👋\n\n" +
        "가족 캘린더 AI 비서입니다.\n" +
        "예를 들어 이렇게 말해보세요:\n\n" +
        "• 내일 오후 3시에 가족 회의 추가해줘\n" +
        "• 8월 30일 오후 7시에 외식 추가해줘\n" +
        "• 이번 달 일정 알려줘"
    );
}


async function login() {

    const email =
        $("authEmail")
            .value
            .trim();

    const password =
        $("authPassword")
            .value;

    if (!email || !password) {

        showAuthError(
            "이메일과 비밀번호를 입력하세요."
        );

        return;
    }

    setAuthLoading(true);

    const {
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email,
                password
            });

    setAuthLoading(false);

    if (error) {

        showAuthError(
            error.message
        );

        return;
    }

    $("authScreen")
        .classList
        .remove("visible");

    await checkAuth();
}


async function signup() {

    const name =
        $("authName")
            .value
            .trim();

    const email =
        $("authEmail")
            .value
            .trim();

    const password =
        $("authPassword")
            .value;

    if (!name || !email || !password) {

        showAuthError(
            "이름, 이메일, 비밀번호를 모두 입력하세요."
        );

        return;
    }

    if (password.length < 6) {

        showAuthError(
            "비밀번호는 6자 이상이어야 합니다."
        );

        return;
    }

    setAuthLoading(true);

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signUp({

                email,

                password,

                options: {

                    data: {

                        display_name:
                            name

                    }

                }

            });

    setAuthLoading(false);

    if (error) {

        showAuthError(
            error.message
        );

        return;
    }

    if (!data.session) {

        showAuthError(
            "회원가입 완료!\n" +
            "이메일 인증이 필요한 경우 이메일을 확인하세요."
        );

        return;
    }

    $("authScreen")
        .classList
        .remove("visible");

    await checkAuth();
}


function setAuthLoading(loading) {

    $("authButton")
        .disabled = loading;

    $("authButton")
        .textContent =
            loading
                ? "처리 중..."
                : authMode === "login"
                    ? "로그인"
                    : "회원가입";
}


function showAuthError(message) {

    $("authError")
        .textContent =
            message;

    $("authError")
        .classList
        .add("visible");
}


function switchAuthMode() {

    authMode =
        authMode === "login"
            ? "signup"
            : "login";

    $("nameRow")
        .style
        .display =
            authMode === "signup"
                ? "block"
                : "none";

    $("authButton")
        .textContent =
            authMode === "login"
                ? "로그인"
                : "회원가입";

    $("authSwitchText")
        .textContent =
            authMode === "login"
                ? "계정이 없나요?"
                : "이미 계정이 있나요?";

    $("authSwitch")
        .textContent =
            authMode === "login"
                ? "회원가입"
                : "로그인";

    $("authError")
        .classList
        .remove("visible");
}


/* =========================================================
   MEMBERS
========================================================= */

async function loadMembers() {

    if (!currentUser) return;

    const {
        data,
        error
    } =
        await supabaseClient
            .from("family_members")
            .select("*")
            .order("created_at");

    if (error) {

        console.error(error);

        return;
    }

    members =
        data || [];

    currentMember =
        members.find(
            member =>
                member.id ===
                currentUser.id
        ) || null;
}


async function saveMyName() {

    if (!currentUser) return;

    const name =
        $("myNameInput")
            .value
            .trim();

    if (!name) return;

    const {
        error
    } =
        await supabaseClient
            .from("family_members")
            .update({
                display_name: name
            })
            .eq(
                "id",
                currentUser.id
            );

    if (error) {

        alert(
            error.message
        );

        return;
    }

    await loadMembers();

    renderFamily();

    alert(
        "이름이 저장되었습니다."
    );
}


/* =========================================================
   EVENTS
========================================================= */

async function loadEvents() {

    if (!currentUser) return;

    const {
        data,
        error
    } =
        await supabaseClient
            .from("events")
            .select("*")
            .order(
                "event_date",
                {
                    ascending: true
                }
            );

    if (error) {

        console.error(error);

        setStatus(
            "● 일정 불러오기 실패"
        );

        return;
    }

    events =
        data || [];

    setStatus(
        "● 실시간 연결됨"
    );

    renderCalendar();
}


function subscribeRealtime() {

    if (!supabaseClient) return;

    supabaseClient
        .channel(
            "family-calendar-events"
        )

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "events"
            },
            async payload => {

                console.log(
                    "Realtime:",
                    payload
                );

                await loadEvents();

            }
        )

        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "family_members"
            },
            async payload => {

                await loadMembers();

                renderFamily();

                renderCalendar();

            }
        )

        .subscribe(
            status => {

                if (
                    status ===
                    "SUBSCRIBED"
                ) {

                    setStatus(
                        "● 실시간 연결됨"
                    );

                }

                if (
                    status ===
                    "CHANNEL_ERROR"
                ) {

                    setStatus(
                        "● 실시간 오류"
                    );

                }

            }
        );
}


/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar() {

    const year =
        currentDate
            .getFullYear();

    const month =
        currentDate
            .getMonth();

    $("calendarTitle")
        .textContent =
            `${year}년 ${month + 1}월`;

    const first =
        new Date(
            year,
            month,
            1
        );

    const last =
        new Date(
            year,
            month + 1,
            0
        );

    const startDay =
        first.getDay();

    const totalDays =
        last.getDate();

    const previousLast =
        new Date(
            year,
            month,
            0
        ).getDate();

    let html = "";

    for (
        let i = 0;
        i < 42;
        i++
    ) {

        const dayIndex =
            i -
            startDay +
            1;

        let date;

        let otherMonth =
            false;

        if (
            dayIndex <= 0
        ) {

            date =
                new Date(
                    year,
                    month - 1,
                    previousLast +
                    dayIndex
                );

            otherMonth =
                true;

        } else if (
            dayIndex >
            totalDays
        ) {

            date =
                new Date(
                    year,
                    month + 1,
                    dayIndex -
                    totalDays
                );

            otherMonth =
                true;

        } else {

            date =
                new Date(
                    year,
                    month,
                    dayIndex
                );

        }

        const iso =
            toISODate(date);

        const today =
            iso ===
            toISODate(
                new Date()
            );

        const dayEvents =
            events.filter(
                event =>
                    event.event_date ===
                    iso
            );

        html += `

            <div
                class="
                    day
                    ${otherMonth ? "other-month" : ""}
                    ${today ? "today" : ""}
                "
                data-date="${iso}"
            >

                <div class="day-number">
                    ${date.getDate()}
                </div>

                <div class="event-list">

                    ${dayEvents
                        .map(event => `

                            <div
                                class="event-item"
                                data-event-id="${event.id}"
                            >
                                ${
                                    event.event_time
                                        ? escapeHTML(
                                            event.event_time
                                          ) + " "
                                        : ""
                                }

                                ${escapeHTML(
                                    event.title
                                )}
                            </div>

                        `)
                        .join("")}

                </div>

            </div>

        `;
    }

    $("calendarGrid")
        .innerHTML =
            html;

    document
        .querySelectorAll(
            ".day"
        )
        .forEach(day => {

            day.addEventListener(
                "click",
                event => {

                    const item =
                        event.target
                            .closest(
                                ".event-item"
                            );

                    if (item) {

                        event.stopPropagation();

                        openEvent(
                            item.dataset
                                .eventId
                        );

                        return;
                    }

                    openNewEvent(
                        day.dataset.date
                    );

                }
            );

        });
}


function toISODate(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const d =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${y}-${m}-${d}`;
}


function openNewEvent(date) {

    $("eventId")
        .value = "";

    $("eventTitle")
        .value = "";

    $("eventDate")
        .value =
            date ||
            toISODate(
                new Date()
            );

    $("eventTime")
        .value = "";

    $("eventDescription")
        .value = "";

    $("eventModalTitle")
        .textContent =
            "일정 추가";

    $("eventDelete")
        .style
        .display =
            "none";

    renderShareList([]);

    showModal(
        "eventModal"
    );
}


function openEvent(id) {

    const event =
        events.find(
            item =>
                item.id === id
        );

    if (!event) return;

    if (
        event.owner_id !==
        currentUser.id
    ) {

        alert(
            "이 일정은 공유받은 일정입니다.\n" +
            "일정을 만든 사람만 수정할 수 있습니다."
        );

        return;
    }

    $("eventId")
        .value =
            event.id;

    $("eventTitle")
        .value =
            event.title || "";

    $("eventDate")
        .value =
            event.event_date;

    $("eventTime")
        .value =
            event.event_time || "";

    $("eventDescription")
        .value =
            event.description || "";

    $("eventModalTitle")
        .textContent =
            "일정 수정";

    $("eventDelete")
        .style
        .display =
            "block";

    renderShareList(
        event.shared_with || []
    );

    showModal(
        "eventModal"
    );
}


function renderShareList(selected) {

    const selectedSet =
        new Set(
            selected || []
        );

    $("shareList")
        .innerHTML =
            members
                .map(
                    member => {

                        const checked =
                            selectedSet.has(
                                member.id
                            );

                        const isMe =
                            member.id ===
                            currentUser?.id;

                        return `

                            <label
                                class="share-member"
                            >

                                <input
                                    type="checkbox"
                                    value="${member.id}"
                                    ${checked ? "checked" : ""}
                                    ${isMe ? "checked disabled" : ""}
                                >

                                <div>

                                    <div
                                        class="member-name"
                                    >
                                        ${escapeHTML(
                                            member.display_name
                                        )}
                                        ${
                                            isMe
                                                ? " (나)"
                                                : ""
                                        }
                                    </div>

                                    <div
                                        class="member-email"
                                    >
                                        ${escapeHTML(
                                            member.email
                                        )}
                                    </div>

                                </div>

                            </label>

                        `;
                    }
                )
                .join("");
}


function getSelectedMembers() {

    const result = [];

    document
        .querySelectorAll(
            "#shareList input[type=checkbox]"
        )
        .forEach(input => {

            if (
                input.checked
            ) {

                result.push(
                    input.value
                );

            }

        });

    if (
        currentUser &&
        !result.includes(
            currentUser.id
        )
    ) {

        result.push(
            currentUser.id
        );

    }

    return result;
}


async function saveEvent() {

    if (!currentUser) return;

    const id =
        $("eventId")
            .value;

    const title =
        $("eventTitle")
            .value
            .trim();

    const eventDate =
        $("eventDate")
            .value;

    const eventTime =
        $("eventTime")
            .value;

    const description =
        $("eventDescription")
            .value
            .trim();

    if (
        !title ||
        !eventDate
    ) {

        alert(
            "일정 이름과 날짜를 입력하세요."
        );

        return;
    }

    const sharedWith =
        getSelectedMembers();

    const payload = {

        title,

        event_date:
            eventDate,

        event_time:
            eventTime,

        description,

        owner_id:
            currentUser.id,

        shared_with:
            sharedWith

    };

    let result;

    if (id) {

        result =
            await supabaseClient
                .from("events")
                .update(payload)
                .eq(
                    "id",
                    id
                )
                .eq(
                    "owner_id",
                    currentUser.id
                );

    } else {

        result =
            await supabaseClient
                .from("events")
                .insert(
                    payload
                );

    }

    if (result.error) {

        alert(
            "저장 실패:\n" +
            result.error.message
        );

        return;
    }

    hideModal(
        "eventModal"
    );

    await loadEvents();
}


async function deleteEvent() {

    const id =
        $("eventId")
            .value;

    if (!id) return;

    if (
        !confirm(
            "이 일정을 삭제할까요?"
        )
    ) return;

    const {
        error
    } =
        await supabaseClient
            .from("events")
            .delete()
            .eq(
                "id",
                id
            )
            .eq(
                "owner_id",
                currentUser.id
            );

    if (error) {

        alert(
            "삭제 실패:\n" +
            error.message
        );

        return;
    }

    hideModal(
        "eventModal"
    );

    await loadEvents();
}


/* =========================================================
   FAMILY UI
========================================================= */

function renderFamily() {

    if (!currentUser) return;

    const me =
        members.find(
            member =>
                member.id ===
                currentUser.id
        );

    $("currentAccount")
        .innerHTML = `

            <div class="member-row">

                <div class="member-info">

                    <div class="member-name">
                        ${escapeHTML(
                            me?.display_name ||
                            currentUser.email
                        )}
                    </div>

                    <div class="member-email">
                        ${escapeHTML(
                            currentUser.email
                        )}
                    </div>

                </div>

            </div>

        `;

    $("myNameInput")
        .value =
            me?.display_name || "";

    $("memberList")
        .innerHTML =
            members
                .map(
                    member => `

                        <div
                            class="member-row"
                        >

                            <div
                                class="member-info"
                            >

                                <div
                                    class="member-name"
                                >

                                    ${escapeHTML(
                                        member.display_name
                                    )}

                                    ${
                                        member.id ===
                                        currentUser.id
                                            ? " (나)"
                                            : ""
                                    }

                                </div>

                                <div
                                    class="member-email"
                                >

                                    ${escapeHTML(
                                        member.email
                                    )}

                                </div>

                            </div>

                        </div>

                    `
                )
                .join("");
}


/* =========================================================
   AI
========================================================= */

function addAIMessage(
    text,
    type = "ai"
) {

    const box =
        $("aiMessages");

    const div =
        document.createElement(
            "div"
        );

    div.className =
        `message ${type}`;

    div.textContent =
        text;

    box.appendChild(
        div
    );

    box.scrollTop =
        box.scrollHeight;
}


async function sendAI() {

    const input =
        $("aiInput");

    const text =
        input.value
            .trim();

    if (!text) return;

    input.value = "";

    addAIMessage(
        text,
        "user"
    );

    const geminiKey =
        localStorage.getItem(
            STORAGE.geminiKey
        );

    if (!geminiKey) {

        addAIMessage(
            "Gemini API Key가 설정되지 않았습니다.\n" +
            "Supabase 설정에서 Gemini API Key를 입력하세요."
        );

        return;
    }

    addAIMessage(
        "생각하는 중..."
    );

    try {

        const context =
            events
                .slice(0, 100)
                .map(
                    event => ({
                        id:
                            event.id,

                        title:
                            event.title,

                        date:
                            event.event_date,

                        time:
                            event.event_time,

                        description:
                            event.description
                    })
                );

        const today =
            toISODate(
                new Date()
            );

        const prompt = `

너는 가족 캘린더 AI 비서다.

오늘 날짜:
${today}

사용자 요청:
${text}

현재 사용자가 볼 수 있는 일정:
${JSON.stringify(context)}

반드시 JSON 하나만 반환한다.

형식:

{
  "action": "chat" | "add_event" | "delete_event",
  "message": "사용자에게 보여줄 답변",
  "event": {

    "description": ""
  },
  "eventId": ""
}

규칙:

1. 일정 추가 요청이면 action은 add_event.
2. 일정 삭제 요청이면 action은 delete_event.
3. 일반 질문이면 action은 chat.
4. 상대 날짜를 정확한 날짜로 계산한다.
5. 시간은 모르면 빈 문자열.
6. 삭제할 때 기존 일정에서 가장 일치하는 eventId를 사용한다.
7. JSON 외의 문자는 절대 출력하지 않는다.

                    method:

                                        }

                                    ]

                                }

                            ],

                            }

                        })

                }
            );

        if (
            !response.ok
        ) {

            throw new Error(
                `Gemini HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        const raw =
            data
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;

        if (!raw) {

            throw new Error(

            );
        }

        const result =

            );

        const thinking =

        if (

        ) {

            thinking.remove();

        if (
            result.action ===
            "add_event"
        ) {

            const eventDate =
                result.event?.date;

            if (!eventDate) {

                addAIMessage(
                    "날짜를 정확히 확인하지 못했습니다."
                );

                return;
            }

            const newEvent = {

                title:
                    result.event?.title ||
                    "새 일정",

                event_date:
                    eventDate,

                event_time:
                    result.event?.time ||
                    "",

                description:
                    result.event?.description ||
                    "",

                owner_id:
                    currentUser.id,

                shared_with:
                    members.map(

                            member.id
                    )

            };

            const {
                error
            } =
                await supabaseClient
                    .from("events")
                    .insert(
                        newEvent
                    );

            if (error) {

                throw error;
            }

            addAIMessage(
                result.message ||
                "일정을 추가했습니다."
            );

            await loadEvents();

            return;
        }

        if (
            result.action ===
            "delete_event"
        ) {

            if (
                !result.eventId
            ) {

                addAIMessage(
                    "삭제할 일정을 찾지 못했습니다."
                );

                return;
            }

            const {
                error
            } =
                await supabaseClient
                    .from("events")
                    .delete()
                    .eq(
                        "id",
                        result.eventId
                    )
                    .eq(
                        "owner_id",
                        currentUser.id
                    );

            if (error) {

                throw error;
            }

            addAIMessage(
                result.message ||
                "일정을 삭제했습니다."

            await loadEvents();

        }

        addAIMessage(
            "AI 요청 중 오류가 발생했습니다.\n\n" +
            error.message
        );
    }

function openWindow(id) {

    const win =
        $(id);

    win.classList.add(
        "visible"
    );

    highestZ++;

    win.style.zIndex =
        highestZ;
}


function closeWindow(id) {

    $(id)
        .classList
        .remove("visible");
}


function maximizeWindow(id) {

    const win =
        $(id);

    win.classList.toggle(
        "maximized"
    );

    highestZ++;

    win.style.zIndex =
        highestZ;
}


/* =========================================================
   WINDOW DRAG
========================================================= */

function setupWindowDragging() {

    document
        .querySelectorAll(
            ".window"
        )
        .forEach(
            win => {

                const titlebar =
                    win.querySelector(
                        ".titlebar"
                    );

                let dragging =
                    false;

                let offsetX =
                    0;

                let offsetY =
                    0;

                titlebar.addEventListener(
                    "pointerdown",
                    e => {

                        if (
                            e.target.closest(
                                ".window-control"
                            )
                        ) {
                            return;
                        }

                        if (
                            win.classList.contains(
                                "maximized"
                            )
                        ) {
                            return;
                        }

                        dragging =
                            true;

                        offsetX =
                            e.clientX -
                            win.offsetLeft;

                        offsetY =
                            e.clientY -
                            win.offsetTop;

                        titlebar.setPointerCapture(
                            e.pointerId
                        );

                        highestZ++;

                        win.style.zIndex =
                            highestZ;

                        e.preventDefault();
                    }
                );

                titlebar.addEventListener(
                    "pointermove",
                    e => {

                        if (!dragging)
                            return;

                        let x =
                            e.clientX -
                            offsetX;

                        let y =
                            e.clientY -
                            offsetY;

                        const taskbarHeight =
                            48;

                        const maxX =
                            Math.max(
                                0,
                                window.innerWidth -
                                win.offsetWidth
                            );

                        const maxY =
                            Math.max(
                                0,
                                window.innerHeight -
                                taskbarHeight -
                                win.offsetHeight
                            );

                        x =
                            Math.max(
                                0,
                                Math.min(
                                    x,
                                    maxX
                                )
                            );

                        y =
                            Math.max(
                                0,
                                Math.min(
                                    y,
                                    maxY
                                )
                            );

                        win.style.left =
                            x + "px";

                        win.style.top =
                            y + "px";

                    }
                );

                const stopDragging =
                    e => {

                        dragging =
                            false;

                        try {

                            if (
                                titlebar.hasPointerCapture(
                                    e.pointerId
                                )
                            ) {

                                titlebar.releasePointerCapture(
                                    e.pointerId
                                );

                            }

                        } catch {}

                    };

                titlebar.addEventListener(
                    "pointerup",
                    stopDragging
                );

                titlebar.addEventListener(
                    "pointercancel",
                    stopDragging
                );

            }
        );
}


/* =========================================================
   WINDOW RESIZE
========================================================= */

function setupWindowResizing() {

    document
        .querySelectorAll(
            ".window"
        )
        .forEach(
            win => {

                const handle =
                    win.querySelector(
                        ".window-resize-handle"
                    );

                if (!handle)
                    return;

                let resizing =
                    false;

                let startX =
                    0;

                let startY =
                    0;

                let startWidth =
                    0;

                let startHeight =
                    0;

                let startLeft =
                    0;

                let startTop =
                    0;

                const MIN_WIDTH =
                    330;

                const MIN_HEIGHT =
                    300;

                handle.addEventListener(
                    "pointerdown",
                    e => {

                        if (
                            win.classList.contains(
                                "maximized"
                            )
                        ) {
                            return;
                        }

                        e.preventDefault();

                        e.stopPropagation();

                        resizing =
                            true;

                        startX =
                            e.clientX;

                        startY =
                            e.clientY;

                        startWidth =
                            win.offsetWidth;

                        startHeight =
                            win.offsetHeight;

                        startLeft =
                            win.offsetLeft;

                        startTop =
                            win.offsetTop;

                        highestZ++;

                        win.style.zIndex =
                            highestZ;

                        handle.setPointerCapture(
                            e.pointerId
                        );
                    }
                );

                handle.addEventListener(
                    "pointermove",
                    e => {

                        if (!resizing)
                            return;

                        e.preventDefault();

                        const dx =
                            e.clientX -
                            startX;

                        const dy =
                            e.clientY -
                            startY;

                        let newWidth =
                            startWidth +
                            dx;

                        let newHeight =
                            startHeight +
                            dy;

                        newWidth =
                            Math.max(
                                MIN_WIDTH,
                                newWidth
                            );

                        newHeight =
                            Math.max(
                                MIN_HEIGHT,
                                newHeight
                            );

                        const availableWidth =
                            Math.max(
                                MIN_WIDTH,
                                window.innerWidth -
                                startLeft
                            );

                        const availableHeight =
                            Math.max(
                                MIN_HEIGHT,
                                window.innerHeight -
                                48 -
                                startTop
                            );

                        newWidth =
                            Math.min(
                                newWidth,
                                availableWidth
                            );

                        newHeight =
                            Math.min(
                                newHeight,
                                availableHeight
                            );

                        win.style.width =
                            newWidth + "px";

                        win.style.height =
                            newHeight + "px";
                    }
                );

                const stopResizing =
                    e => {

                        if (!resizing)
                            return;

                        resizing =
                            false;

                        try {

                            if (
                                handle.hasPointerCapture(
                                    e.pointerId
                                )
                            ) {

                                handle.releasePointerCapture(
                                    e.pointerId
                                );

                            }

                        } catch {}

                    };

                handle.addEventListener(
                    "pointerup",
                    stopResizing
                );

                handle.addEventListener(
                    "pointercancel",
                    stopResizing
                );

            }
        );
}


/* =========================================================
   DESKTOP ICON DRAG
========================================================= */

function setupDesktopIcons() {

    document
        .querySelectorAll(
            ".desktop-icon"
        )
        .forEach(
            icon => {

                let dragging =
                    false;

                let startX =
                    0;

                let startY =
                    0;

                let originalX =
                    0;

                let originalY =
                    0;

                icon.addEventListener(
                    "pointerdown",
                    e => {

                        dragging =
                            true;

                        startX =
                            e.clientX;

                        startY =
                            e.clientY;

                        originalX =
                            icon.offsetLeft;

                        originalY =
                            icon.offsetTop;

                        icon.setPointerCapture(
                            e.pointerId
                        );

                        e.preventDefault();
                    }
                );

                icon.addEventListener(
                    "pointermove",
                    e => {

                        if (!dragging)
                            return;

                        const dx =
                            e.clientX -
                            startX;

                        const dy =
                            e.clientY -
                            startY;

                        icon.style.left =
                            Math.max(
                                0,
                                originalX +
                                dx
                            ) + "px";

                        icon.style.top =
                            Math.max(
                                0,
                                originalY +
                                dy
                            ) + "px";
                    }
                );

                const stopIconDrag =
                    e => {

                        if (!dragging)
                            return;

                        dragging =
                            false;

                        saveIconPositions();

                        try {

                            if (
                                icon.hasPointerCapture(
                                    e.pointerId
                                )
                            ) {

                                icon.releasePointerCapture(
                                    e.pointerId
                                );

                            }

                        } catch {}
                    };

                icon.addEventListener(
                    "pointerup",
                    stopIconDrag
                );

                icon.addEventListener(
                    "pointercancel",
                    stopIconDrag
                );

                icon.addEventListener(
                    "dblclick",
                    () => {

                        const app =
                            icon.dataset.app;

                        if (
                            app ===
                            "calendar"
                        ) {

                            openWindow(
                                "calendarWindow"
                            );

                        }

                        if (
                            app ===
                            "ai"
                        ) {

                            openWindow(
                                "aiWindow"
                            );

                        }

                        if (
                            app ===
                            "family"
                        ) {

                            renderFamily();

                            showModal(
                                "familyModal"
                            );

                        }

                    }
                );

            }
        );

    loadIconPositions();
}


function saveIconPositions() {

    const data = {};

    document
        .querySelectorAll(
            ".desktop-icon"
        )
        .forEach(
            icon => {

                data[
                    icon.dataset.app
                ] = {

                    left:
                        icon.offsetLeft,

                    top:
                        icon.offsetTop

                };

            }
        );

    localStorage.setItem(
        STORAGE.iconPositions,
        JSON.stringify(
            data
        )
    );
}


function loadIconPositions() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    STORAGE.iconPositions
                ) || "{}"
            );

        document
            .querySelectorAll(
                ".desktop-icon"
            )
            .forEach(
                icon => {

                    const pos =
                        data[
                            icon.dataset.app
                        ];

                    if (!pos)
                        return;

                    icon.style.left =
                        pos.left +
                        "px";

                    icon.style.top =
                        pos.top +
                        "px";

                }
            );

    } catch {}
}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();

    const date =
        now.toLocaleDateString(
            "ko-KR",
            {
                month:
                    "numeric",

                day:
                    "numeric",

                weekday:
                    "short"
            }
        );

    const time =
        now.toLocaleTimeString(
            "ko-KR",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        );

    $("clock")
        .innerHTML =
            `${date}<br>${time}`;
}

            .value

            .value

    localStorage.setItem(

    );

            gemini
        );

    }

    hideModal(
        "setupModal"
    );

    location.reload();
}
