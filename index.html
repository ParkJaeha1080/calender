<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가족 캘린더</title>

<style>
:root {
    --bg-base: #111317;
    --window-bg: rgba(26, 29, 36, 0.88);
    --window-border: rgba(255, 255, 255, 0.08);
    --taskbar-bg: rgba(18, 20, 24, 0.82);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --surface-active: rgba(255, 255, 255, 0.1);
    --text-main: #e6edf3;
    --text-sub: #8b949e;
    --text-muted: #484f58;
    --primary: #2f81f7;
    --primary-hover: #388bfd;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    color: var(--text-main);
    background: #0d1117;
    -webkit-font-smoothing: antialiased;
}

/* 배경: 사이버틱한 원형 네온 대신 실제 OS 감성의 정제된 조명 효과 */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: 
        radial-gradient(1200px 800px at 15% 10%, rgba(47, 129, 247, 0.12), transparent 60%),
        radial-gradient(1000px 700px at 85% 90%, rgba(139, 92, 246, 0.08), transparent 60%);
    pointer-events: none;
}

/* =========================================================
   DESKTOP & ICONS
========================================================= */
#desktop {
    position: fixed;
    inset: 0 0 48px 0;
    overflow: hidden;
}

.desktop-icon {
    position: absolute;
    width: 84px;
    padding: 10px 4px;
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: background 0.15s, border-color 0.15s;
    border: 1px solid transparent;
}

.desktop-icon:hover {
    background: var(--surface-hover);
    border-color: rgba(255, 255, 255, 0.04);
}

.desktop-icon.selected {
    background: var(--surface-active);
    border-color: rgba(255, 255, 255, 0.1);
}

.icon-image {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
}

.icon-image svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    color: #e6edf3;
}

.icon-label {
    font-size: 11.5px;
    text-align: center;
    color: #cbd5e1;
    letter-spacing: -0.2px;
}

/* =========================================================
   TASKBAR
========================================================= */
#taskbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 48px;
    background: var(--taskbar-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    z-index: 10000;
}

.taskbar-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.taskbar-right {
    display: flex;
    align-items: center;
    padding-right: 14px;
    gap: 12px;
}

.task-button {
    width: 38px;
    height: 38px;
    border: 0;
    background: transparent;
    color: var(--text-main);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
}

.task-button svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    opacity: 0.85;
}

.task-button:hover {
    background: var(--surface-hover);
}

.task-button.active {
    background: var(--surface-active);
}

.connection {
    font-size: 11px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 6px;
}

.connection::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3fb950;
    display: inline-block;
}

.clock {
    min-width: 68px;
    text-align: right;
    font-size: 11px;
    line-height: 1.35;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
}

/* =========================================================
   WINDOWS
========================================================= */
.window {
    position: absolute;
    left: 140px;
    top: 60px;
    width: 880px;
    height: 640px;
    min-width: 340px;
    min-height: 320px;
    display: none;
    flex-direction: column;
    background: var(--window-bg);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid var(--window-border);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    overflow: hidden;
    z-index: 100;
    touch-action: none;
}

.window.visible {
    display: flex;
}

.window.maximized {
    left: 8px !important;
    top: 8px !important;
    width: calc(100vw - 16px) !important;
    height: calc(100vh - 64px) !important;
    border-radius: var(--radius-md);
}

/* =========================================================
   TITLEBAR
========================================================= */
.titlebar {
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding-left: 14px;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border-subtle);
    cursor: move;
    user-select: none;
    touch-action: none;
}

.title {
    flex: 1;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 8px;
}

.title svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
}

.window-controls {
    display: flex;
    height: 100%;
    touch-action: auto;
}

.window-control {
    width: 44px;
    height: 100%;
    border: 0;
    background: transparent;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
}

.window-control svg {
    width: 10px;
    height: 10px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.2;
}

.window-control:hover {
    background: var(--surface-hover);
    color: var(--text-main);
}

.window-control.close:hover {
    background: #e81123;
    color: white;
}

/* =========================================================
   WINDOW CONTENT & LAYOUT
========================================================= */
.window-content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px;
    touch-action: pan-x pan-y;
}

.calendar-layout {
    display: flex;
    gap: 16px;
    height: 100%;
}

.calendar-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.calendar-sidebar {
    width: 230px;
    flex-shrink: 0;
    background: rgba(0, 0, 0, 0.22);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-subtle);
}

.sidebar-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-subtle);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.agenda-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.agenda-item {
    background: rgba(255, 255, 255, 0.03);
    border-left: 3px solid;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
}

.agenda-item:hover {
    background: rgba(255, 255, 255, 0.06);
}

.agenda-time {
    font-size: 10px;
    color: var(--text-sub);
    margin-bottom: 3px;
    font-variant-numeric: tabular-nums;
}

.agenda-title {
    font-size: 12px;
    font-weight: 500;
    word-break: break-all;
    line-height: 1.35;
}

/* =========================================================
   CALENDAR
========================================================= */
.calendar-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
}

.calendar-title {
    flex: 1;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
}

.btn {
    border: 1px solid var(--border-subtle);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-main);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    touch-action: auto;
    transition: background 0.15s, border-color 0.15s;
}

.btn:hover {
    background: var(--surface-hover);
    border-color: rgba(255, 255, 255, 0.15);
}

.btn.primary {
    background: var(--primary);
    border-color: var(--primary);
}

.btn.primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
}

.calendar-week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    margin-bottom: 4px;
}

.weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-sub);
    padding: 6px 0;
}

.calendar-grid-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.calendar-week-row {
    position: relative;
    min-height: 84px;
}

.calendar-days-layer {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    min-height: 84px;
}

.day {
    position: relative;
    border: 1px solid var(--border-subtle);
    background: rgba(255, 255, 255, 0.02);
    border-radius: var(--radius-sm);
    padding: 6px;
    cursor: pointer;
    touch-action: auto;
    min-height: 84px;
    transition: background 0.15s, border-color 0.15s;
}

.day:hover {
    background: rgba(255, 255, 255, 0.05);
}

.day.other-month {
    opacity: 0.3;
}

.day.today {
    border-color: rgba(47, 129, 247, 0.6);
    background: rgba(47, 129, 247, 0.04);
}

.day.today .day-number {
    color: var(--primary);
}

.day-number {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
}

.calendar-events-layer {
    position: absolute;
    top: 26px;
    left: 0;
    right: 0;
    bottom: 4px;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: min-content;
    gap: 3px 4px;
    pointer-events: none;
    padding: 0 4px;
}

.event-bar {
    pointer-events: auto;
    font-size: 10.5px;
    background: #1f6feb;
    color: #ffffff;
    border-radius: 3px;
    padding: 3px 5px;
    line-height: 1.25;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: filter 0.15s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

.event-bar:hover {
    filter: brightness(1.15);
}

.event-bar.is-start {
    border-top-left-radius: 3px;
    border-bottom-left-radius: 3px;
}
.event-bar:not(.is-start) {
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
    opacity: 0.9;
}
.event-bar.is-end {
    border-top-right-radius: 3px;
    border-bottom-right-radius: 3px;
}
.event-bar:not(.is-end) {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
}

.event-time-badge {
    font-size: 8.5px;
    opacity: 0.9;
    font-weight: 600;
    background: rgba(0, 0, 0, 0.25);
    padding: 1px 3px;
    border-radius: 2px;
    flex-shrink: 0;
}

.event-text {
    flex: 1 1 auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Color Picker */
.color-picker-group {
    display: flex;
    gap: 8px;
    align-items: center;
}

.color-swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
}

.color-swatch:hover {
    transform: scale(1.1);
}

.color-swatch.active {
    border-color: #ffffff;
    transform: scale(1.1);
}

/* =========================================================
   RESIZE HANDLE
========================================================= */
.window-resize-handle {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 16px;
    height: 16px;
    cursor: nwse-resize;
    z-index: 100;
    touch-action: none;
}

.window-resize-handle::after {
    content: "";
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid var(--text-muted);
    border-bottom: 1.5px solid var(--text-muted);
}

.window.maximized .window-resize-handle {
    display: none;
}

/* =========================================================
   AI WINDOW
========================================================= */
.ai-layout {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.ai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    touch-action: pan-y;
}

.message {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.message.ai {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-subtle);
}

.message.user {
    align-self: flex-end;
    background: var(--primary);
    color: white;
}

.ai-input {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.ai-input input {
    flex: 1;
}

/* =========================================================
   FORMS & INPUTS
========================================================= */
input, textarea, select {
    width: 100%;
    border: 1px solid var(--border-subtle);
    background: rgba(0, 0, 0, 0.25);
    color: var(--text-main);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 12.5px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    touch-action: auto;
}

select option {
    background: #181b20;
    color: var(--text-main);
}

textarea {
    resize: vertical;
    min-height: 80px;
}

input:focus, textarea:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(47, 129, 247, 0.2);
}

.form-row {
    margin-bottom: 12px;
}

.form-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-sub);
    margin-bottom: 5px;
}

.share-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 130px;
    overflow-y: auto;
}

.share-member {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.03);
    cursor: pointer;
}

.share-member input {
    width: auto;
    margin: 0;
}

/* =========================================================
   MODALS
========================================================= */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20000;
    padding: 20px;
}

.modal.visible {
    display: flex;
}

.modal-box {
    width: min(440px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: #16191f;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    padding: 20px;
}

.modal-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    letter-spacing: -0.2px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 18px;
}

/* =========================================================
   LOGIN
========================================================= */
#authScreen {
    position: fixed;
    inset: 0;
    z-index: 30000;
    display: none;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    padding: 20px;
}

#authScreen.visible {
    display: flex;
}

.auth-box {
    width: min(380px, 100%);
    background: #16191f;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

.auth-title {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
}

.auth-subtitle {
    text-align: center;
    color: var(--text-sub);
    font-size: 12px;
    margin-top: 4px;
    margin-bottom: 20px;
}

.auth-error {
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid rgba(248, 81, 73, 0.4);
    color: #ff7b72;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    margin-bottom: 12px;
    display: none;
}

.auth-error.visible {
    display: block;
}

.auth-switch {
    margin-top: 14px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-sub);
}

.auth-switch button {
    border: 0;
    background: transparent;
    color: var(--primary);
    cursor: pointer;
    padding: 0 4px;
}

/* =========================================================
   FAMILY / MEMBERS
========================================================= */
.member-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.03);
    margin-bottom: 6px;
}

.member-info {
    flex: 1;
}

.member-name {
    font-size: 12px;
    font-weight: 500;
}

.member-email {
    font-size: 10px;
    color: var(--text-sub);
}

/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 700px) {
    .window {
        left: 6px;
        top: 6px;
        width: calc(100vw - 12px);
        height: calc(100vh - 60px);
    }
    .calendar-layout {
        flex-direction: column;
    }
    .calendar-sidebar {
        width: 100%;
        max-height: 200px;
        order: -1;
    }
}
</style>
</head>

<body>

<!-- DESKTOP -->
<div id="desktop">
    <div class="desktop-icon" data-app="calendar" style="left:20px;top:20px">
        <div class="icon-image">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/></svg>
        </div>
        <div class="icon-label">캘린더</div>
    </div>
    <div class="desktop-icon" data-app="ai" style="left:20px;top:120px">
        <div class="icon-image">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
        </div>
        <div class="icon-label">어시스턴트</div>
    </div>
    <div class="desktop-icon" data-app="family" style="left:20px;top:220px">
        <div class="icon-image">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>
        <div class="icon-label">가족 관리</div>
    </div>
</div>

<!-- CALENDAR WINDOW -->
<div class="window" id="calendarWindow">
    <div class="titlebar">
        <div class="title">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
            일정
        </div>
        <div class="window-controls">
            <button class="window-control" data-minimize="calendarWindow">
                <svg viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5"/></svg>
            </button>
            <button class="window-control" data-maximize="calendarWindow">
                <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg>
            </button>
            <button class="window-control close" data-close="calendarWindow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const STORAGE = {
    supabaseUrl: "windows11_supabase_url",
    supabaseKey: "windows11_supabase_key",
    geminiKey: "windows11_gemini_key",
    iconPositions: "windows11_family_calendar_icons",
    calendarMonth: "windows11_calendar_month"
};

let supabaseClient = null;
let currentUser = null;
let currentMember = null;
let members = [];
let events = [];
let currentDate = new Date();
let authMode = "login";
let highestZ = 200;

const $ = id => document.getElementById(id);

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function showModal(id) { $(id).classList.add("visible"); }
function hideModal(id) { $(id).classList.remove("visible"); }
function setStatus(text) { $("connectionStatus").textContent = text; }

function selectColor(color) {
    $("eventColor").value = color;
    document.querySelectorAll(".color-swatch").forEach(el => {
        el.classList.toggle("active", el.dataset.color.toLowerCase() === color.toLowerCase());
    });
}

function toISODate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

async function initSupabase() {
    const url = localStorage.getItem(STORAGE.supabaseUrl);
    const key = localStorage.getItem(STORAGE.supabaseKey);

    if (!url || !key) {
        showModal("setupModal");
        return false;
    }

    try {
        const { createClient } = window.supabase;
        supabaseClient = createClient(url, key, {
            auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
        });
        setStatus("동기화 준비 완료");
        return true;
    } catch(error) {
        console.error(error);
        alert("데이터베이스 연결 실패: " + error.message);
        showModal("setupModal");
        return false;
    }
}

async function checkAuth() {
    if (!supabaseClient) return;

    const { data, error } = await supabaseClient.auth.getSession();
    if (error) { console.error(error); return; }

    currentUser = data.session?.user || null;

    if (!currentUser) {
        $("authScreen").classList.add("visible");
        return;
    }

    $("authScreen").classList.remove("visible");
    await loadMembers();
    await loadEvents();
    subscribeRealtime();
    renderCalendar();

    addAIMessage("어떤 일정을 도와드릴까요? 편하게 말씀해 주세요.");
}

async function login() {
    const email = $("authEmail").value.trim();
    const password = $("authPassword").value;
    if (!email || !password) { showAuthError("이메일과 비밀번호를 입력해주세요."); return; }

    setAuthLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    setAuthLoading(false);

    if (error) { showAuthError(error.message); return; }
    $("authScreen").classList.remove("visible");
    await checkAuth();
}

async function signup() {
    const name = $("authName").value.trim();
    const email = $("authEmail").value.trim();
    const password = $("authPassword").value;

    if (!name || !email || !password) { showAuthError("모든 필드를 채워주세요."); return; }
    if (password.length < 6) { showAuthError("비밀번호는 최소 6자 이상이어야 합니다."); return; }

    setAuthLoading(true);
    const { data, error } = await supabaseClient.auth.signUp({
        email, password, options: { data: { display_name: name } }
    });
    setAuthLoading(false);

    if (error) { showAuthError(error.message); return; }
    if (!data.session) {
        showAuthError("확인 메일을 보냈습니다. 이메일을 인증해 주세요.");
        return;
    }
    $("authScreen").classList.remove("visible");
    await checkAuth();
}

function setAuthLoading(loading) {
    $("authButton").disabled = loading;
    $("authButton").textContent = loading ? "요청 중..." : (authMode === "login" ? "로그인" : "회원가입");
}

function showAuthError(message) {
    $("authError").textContent = message;
    $("authError").classList.add("visible");
}

function switchAuthMode() {
    authMode = authMode === "login" ? "signup" : "login";
    $("nameRow").style.display = authMode === "signup" ? "block" : "none";
    $("authButton").textContent = authMode === "login" ? "로그인" : "회원가입";
    $("authSwitchText").textContent = authMode === "login" ? "계정이 없으신가요?" : "이미 계정이 있으신가요?";
    $("authSwitch").textContent = authMode === "login" ? "회원가입" : "로그인";
    $("authError").classList.remove("visible");
}

async function loadMembers() {
    if (!currentUser) return;
    const { data, error } = await supabaseClient.from("family_members").select("*").order("created_at");
    if (error) { console.error(error); return; }
    members = data || [];
    currentMember = members.find(m => m.id === currentUser.id) || null;
}

async function saveMyName() {
    if (!currentUser) return;
    const name = $("myNameInput").value.trim();
    if (!name) return;

    const { error } = await supabaseClient.from("family_members").update({ display_name: name }).eq("id", currentUser.id);
    if (error) { alert(error.message); return; }
    await loadMembers();
    renderFamily();
}

async function loadEvents() {
    if (!currentUser) return;

    const { data, error } = await supabaseClient.from("events").select("*").order("event_date", { ascending: true }).order("event_time", { ascending: true });
    if (error) { setStatus("동기화 실패"); return; }

    events = (data || []).map(ev => {
        let desc = ev.description || "";
        let endDate = ev.event_date;
        const match = desc.match(/^\[END:(\d{4}-\d{2}-\d{2})\]\n?/);
        if (match) {
            endDate = match[1];
            desc = desc.replace(match[0], "");
        }
        return {
            ...ev,
            parsedDescription: desc,
            endDate: endDate >= ev.event_date ? endDate : ev.event_date
        };
    });

    setStatus("실시간 동기화 됨");
    renderCalendar();
}

function subscribeRealtime() {
    if (!supabaseClient) return;

    supabaseClient
        .channel("family-calendar-events")
        .on("postgres_changes", { event: "*", schema: "public", table: "events" }, async () => { await loadEvents(); })
        .on("postgres_changes", { event: "*", schema: "public", table: "family_members" }, async () => {
            await loadMembers();
            renderFamily();
            renderCalendar();
        })
        .subscribe(status => {
            if (status === "SUBSCRIBED") setStatus("실시간 동기화 됨");
            if (status === "CHANNEL_ERROR") setStatus("연결 오류");
        });
}

function renderTodayAgenda() {
    const todayIso = toISODate(new Date());
    const todayEvents = events.filter(ev => {
        const evStart = ev.event_date;
        const evEnd = ev.endDate || ev.event_date;
        return todayIso >= evStart && todayIso <= evEnd;
    }).sort((a, b) => (a.event_time || "").localeCompare(b.event_time || ""));

    const listEl = $("todayAgendaList");
    if (!listEl) return;

    if (todayEvents.length === 0) {
        listEl.innerHTML = '<div style="font-size:11.5px; color:var(--text-sub); text-align:center; padding-top:20px;">일정이 없습니다.</div>';
        return;
    }

    listEl.innerHTML = todayEvents.map(ev => `
        <div class="agenda-item" style="border-left-color: ${ev.color || '#1f6feb'}" onclick="openEvent('${ev.id}')">
            <div class="agenda-time">${ev.event_time ? escapeHTML(ev.event_time) : '종일'}</div>
            <div class="agenda-title">${escapeHTML(ev.title)}</div>
        </div>
    `).join("");
}

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    $("calendarTitle").textContent = `${year}년 ${month + 1}월`;

    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const startDay = first.getDay();
    const totalDays = last.getDate();
    const previousLast = new Date(year, month, 0).getDate();

    let gridHtml = "";

    for (let w = 0; w < 6; w++) {
        const weekDays = [];
        for (let d = 0; d < 7; d++) {
            const dayIndex = w * 7 + d - startDay + 1;
            let date;
            let otherMonth = false;

            if (dayIndex <= 0) {
                date = new Date(year, month - 1, previousLast + dayIndex);
                otherMonth = true;
            } else if (dayIndex > totalDays) {
                date = new Date(year, month + 1, dayIndex - totalDays);
                otherMonth = true;
            } else {
                date = new Date(year, month, dayIndex);
            }

            weekDays.push({
                date,
                iso: toISODate(date),
                otherMonth,
                today: toISODate(date) === toISODate(new Date())
            });
        }

        const weekStartIso = weekDays[0].iso;
        const weekEndIso = weekDays[6].iso;

        const overlappingEvents = events.filter(ev => {
            const evStart = ev.event_date;
            const evEnd = ev.endDate || ev.event_date;
            return evStart <= weekEndIso && evEnd >= weekStartIso;
        }).sort((a, b) => {
            const durA = new Date(a.endDate) - new Date(a.event_date);
            const durB = new Date(b.endDate) - new Date(b.event_date);
            if (durB !== durA) return durB - durA;
            return (a.event_time || "").localeCompare(b.event_time || "");
        });

        const slots = [];
        const barsToRender = [];

        overlappingEvents.forEach(ev => {
            const evStart = ev.event_date;
            const evEnd = ev.endDate || ev.event_date;
            let startCol = 0, endCol = 6;

            for (let i = 0; i < 7; i++) {
                if (weekDays[i].iso === evStart) startCol = i;
                if (weekDays[i].iso === evEnd) endCol = i;
            }

            if (evStart < weekStartIso) startCol = 0;
            if (evEnd > weekEndIso) endCol = 6;

            let slotIndex = 0;
            while (true) {
                if (!slots[slotIndex]) slots[slotIndex] = Array(7).fill(false);
                let conflict = false;
                for (let c = startCol; c <= endCol; c++) {
                    if (slots[slotIndex][c]) { conflict = true; break; }
                }
                if (!conflict) {
                    for (let c = startCol; c <= endCol; c++) slots[slotIndex][c] = true;
                    break;
                }
                slotIndex++;
            }

            barsToRender.push({
                ev, startCol, endCol, slotIndex,
                isStart: evStart >= weekStartIso,
                isEnd: evEnd <= weekEndIso
            });
        });

        const maxSlots = Math.max(slots.length, 2);
        const rowHeight = 24 + maxSlots * 26 + 6;

        let daysHtml = weekDays.map(dayInfo => `
            <div class="day ${dayInfo.otherMonth ? "other-month" : ""} ${dayInfo.today ? "today" : ""}" data-date="${dayInfo.iso}">
                <div class="day-number">${dayInfo.date.getDate()}</div>
            </div>
        `).join("");

        let barsHtml = barsToRender.map(b => {
            const colStart = b.startCol + 1;
            const colSpan = b.endCol - b.startCol + 1;
            const gridRow = b.slotIndex + 1;
            const bgColor = b.ev.color || "#1f6feb";

            return `
                <div class="event-bar ${b.isStart ? "is-start" : ""} ${b.isEnd ? "is-end" : ""}" 
                     style="grid-column: ${colStart} / span ${colSpan}; grid-row: ${gridRow}; background-color: ${bgColor};" 
                     data-event-id="${b.ev.id}">
                    ${(b.isStart && b.ev.event_time) ? `<span class="event-time-badge">${escapeHTML(b.ev.event_time)}</span>` : ""}
                    <span class="event-text">${escapeHTML(b.ev.title)}</span>
                </div>
            `;
        }).join("");

        gridHtml += `
            <div class="calendar-week-row" style="min-height: ${rowHeight}px;">
                <div class="calendar-days-layer" style="min-height: ${rowHeight}px;">${daysHtml}</div>
                <div class="calendar-events-layer">${barsHtml}</div>
            </div>
        `;
    }

    $("calendarGrid").innerHTML = gridHtml;

    document.querySelectorAll(".day").forEach(day => {
        day.addEventListener("click", () => openNewEvent(day.dataset.date));
    });

    document.querySelectorAll(".event-bar").forEach(bar => {
        bar.addEventListener("click", e => {
            e.stopPropagation();
            openEvent(bar.dataset.eventId);
        });
    });

    renderTodayAgenda();
}

function updateRecurrenceFormState(type) {
    $("rangeEndDateRow").style.display = type === "range" ? "block" : "none";
    $("weeklyUntilRow").style.display = type === "weekly" ? "block" : "none";
}

function openNewEvent(date) {
    const defaultDate = date || toISODate(new Date());
    $("eventId").value = "";
    $("eventTitle").value = "";
    $("eventDate").value = defaultDate;
    $("eventRangeEndDate").value = defaultDate;
    
    const defaultUntil = new Date(defaultDate);
    defaultUntil.setMonth(defaultUntil.getMonth() + 1);
    $("eventWeeklyUntil").value = toISODate(defaultUntil);

    $("eventTime").value = "";
    $("eventDescription").value = "";
    $("eventModalTitle").textContent = "새 일정 등록";
    $("eventDelete").style.display = "none";
    $("recurrenceGroup").style.display = "block";
    $("eventRecurrence").value = "none";
    updateRecurrenceFormState("none");

    selectColor("#1f6feb");
    renderShareList([]);
    showModal("eventModal");
}

function openEvent(id) {
    const event = events.find(item => item.id === id);
    if (!event) return;

    if (event.owner_id !== currentUser.id) {
        alert("본인이 등록한 일정만 수정할 수 있습니다.");
        return;
    }

    $("eventId").value = event.id;
    $("eventTitle").value = event.title || "";
    $("eventDate").value = event.event_date;
    $("eventRangeEndDate").value = event.endDate || event.event_date;
    $("eventTime").value = event.event_time || "";
    $("eventDescription").value = event.parsedDescription || "";
    $("eventModalTitle").textContent = "일정 세부 정보";
    $("eventDelete").style.display = "block";

    if (event.endDate && event.endDate !== event.event_date) {
        $("recurrenceGroup").style.display = "block";
        $("eventRecurrence").value = "range";
        updateRecurrenceFormState("range");
    } else {
        $("recurrenceGroup").style.display = "block";
        $("eventRecurrence").value = "none";
        updateRecurrenceFormState("none");
    }

    selectColor(event.color || "#1f6feb");
    renderShareList(event.shared_with || []);
    showModal("eventModal");
}

function renderShareList(selected) {
    const selectedSet = new Set(selected || []);
    $("shareList").innerHTML = members.map(member => {
        const checked = selectedSet.has(member.id);
        const isMe = member.id === currentUser?.id;
        return `
            <label class="share-member">
                <input type="checkbox" value="${member.id}" ${checked ? "checked" : ""} ${isMe ? "checked disabled" : ""}>
                <div>
                    <div class="member-name">${escapeHTML(member.display_name)}${isMe ? " (나)" : ""}</div>
                    <div class="member-email">${escapeHTML(member.email)}</div>
                </div>
            </label>
        `;
    }).join("");
}

function getSelectedMembers() {
    const result = [];
    document.querySelectorAll("#shareList input[type=checkbox]").forEach(input => {
        if (input.checked) result.push(input.value);
    });
    if (currentUser && !result.includes(currentUser.id)) result.push(currentUser.id);
    return result;
}

async function saveEvent() {
    if (!currentUser) return;

    const id = $("eventId").value;
    const title = $("eventTitle").value.trim();
    const eventDate = $("eventDate").value;
    const eventTime = $("eventTime").value;
    const description = $("eventDescription").value.trim();
    const color = $("eventColor").value || "#1f6feb";
    const recurrence = $("eventRecurrence").value;
    const rangeEndDate = $("eventRangeEndDate").value || eventDate;
    const weeklyUntil = $("eventWeeklyUntil").value;

    if (!title || !eventDate) { alert("일정 제목과 날짜를 입력해주세요."); return; }

    const sharedWith = getSelectedMembers();

    if (id) {
        let finalDescription = description;
        if (recurrence === "range" && rangeEndDate >= eventDate) finalDescription = `[END:${rangeEndDate}]\n${description}`;

        const payload = {
            title, event_date: eventDate, event_time: eventTime,
            description: finalDescription, color, owner_id: currentUser.id, shared_with: sharedWith
        };

        const result = await supabaseClient.from("events").update(payload).eq("id", id).eq("owner_id", currentUser.id);
        if (result.error) { alert("저장 실패: " + result.error.message); return; }
    } else {
        if (recurrence === "weekly" && weeklyUntil) {
            const start = new Date(eventDate + "T00:00:00");
            const end = new Date(weeklyUntil + "T23:59:59");
            const newEvents = [];
            let curr = new Date(start);
            while (curr <= end) {
                newEvents.push({
                    title, event_date: toISODate(curr), event_time: eventTime,
                    description, color, owner_id: currentUser.id, shared_with: sharedWith
                });
                curr.setDate(curr.getDate() + 7);
            }
            const result = await supabaseClient.from("events").insert(newEvents);
            if (result.error) { alert("저장 실패: " + result.error.message); return; }
        } else if (recurrence === "range" && rangeEndDate >= eventDate) {
            const payload = {
                title, event_date: eventDate, event_time: eventTime,
                description: `[END:${rangeEndDate}]\n${description}`, color, owner_id: currentUser.id, shared_with: sharedWith
            };
            const result = await supabaseClient.from("events").insert([payload]);
            if (result.error) { alert("저장 실패: " + result.error.message); return; }
        } else {
            const payload = {
                title, event_date: eventDate, event_time: eventTime,
                description, color, owner_id: currentUser.id, shared_with: sharedWith
            };
            const result = await supabaseClient.from("events").insert([payload]);
            if (result.error) { alert("저장 실패: " + result.error.message); return; }
        }
    }

    hideModal("eventModal");
    await loadEvents();
}

async function deleteEvent() {
    const id = $("eventId").value;
    if (!id || !confirm("이 일정을 삭제할까요?")) return;

    const { error } = await supabaseClient.from("events").delete().eq("id", id).eq("owner_id", currentUser.id);
    if (error) { alert("삭제 실패: " + error.message); return; }

    hideModal("eventModal");
    await loadEvents();
}

function addAIMessage(text, type = "ai") {
    const box = $("aiMessages");
    const div = document.createElement("div");
    div.className = `message ${type}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function sendAI() {
    const input = $("aiInput");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addAIMessage(text, "user");

    const geminiKey = localStorage.getItem(STORAGE.geminiKey);
    if (!geminiKey) {
        addAIMessage("설정에서 Gemini API Key를 등록해 주세요.");
        return;
    }

    addAIMessage("처리 중...");

    try {
        const context = events.slice(0, 100).map(e => ({
            id: e.id, title: e.title, startDate: e.event_date,
            endDate: e.endDate, time: e.event_time, description: e.parsedDescription, color: e.color
        }));

        const today = toISODate(new Date());
        const prompt = `
당신은 일정 관리 시스템의 비서 역할을 합니다.
오늘 날짜: ${today}
요청: ${text}
현재 등록된 일정 목록: ${JSON.stringify(context)}

응답은 엄격히 아래 JSON 형식으로만 반환하세요:
{
  "action": "chat" | "add_event" | "delete_event",
  "message": "사용자 안내 메시지",
  "events": [
    {
      "title": "일정 이름",
      "startDate": "YYYY-MM-DD",
      "endDate": "YYYY-MM-DD",
      "time": "HH:MM",
      "description": "",
      "color": "#1f6feb"
    }
  ],
  "eventId": ""
}
색상 옵션: #1f6feb, #238636, #8957e5, #d29922, #da3633, #6e7681
`;

        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(geminiKey),
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.2, responseMimeType: "application/json" }
                })
            }
        );

        if (!response.ok) throw new Error(`API 오류: ${response.status}`);
        const data = await response.json();
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!raw) throw new Error("응답이 비어있습니다.");

        const result = JSON.parse(raw);
        const thinking = $("aiMessages").lastElementChild;
        if (thinking && thinking.textContent === "처리 중...") thinking.remove();

        if (result.action === "add_event") {
            const list = result.events || (result.event ? [result.event] : []);
            if (!list.length) return;

            const newEvents = list.map(ev => {
                const sDate = ev.startDate || ev.date;
                const eDate = ev.endDate || sDate;
                const desc = (eDate !== sDate) ? `[END:${eDate}]\n${ev.description || ""}` : (ev.description || "");
                return {
                    title: ev.title || "새 일정", event_date: sDate, event_time: ev.time || "",
                    description: desc, color: ev.color || "#1f6feb", owner_id: currentUser.id,
                    shared_with: members.map(m => m.id)
                };
            });

            const { error } = await supabaseClient.from("events").insert(newEvents);
            if (error) throw error;

            addAIMessage(result.message || "일정을 등록했습니다.");
            await loadEvents();
            return;
        }

        if (result.action === "delete_event") {
            if (!result.eventId) { addAIMessage("해당 일정을 찾지 못했습니다."); return; }
            const { error } = await supabaseClient.from("events").delete().eq("id", result.eventId).eq("owner_id", currentUser.id);
            if (error) throw error;
            addAIMessage(result.message || "일정을 삭제했습니다.");
            await loadEvents();
            return;
        }

        addAIMessage(result.message || "확인했습니다.");
    } catch(error) {
        console.error(error);
        const thinking = $("aiMessages").lastElementChild;
        if (thinking && thinking.textContent === "처리 중...") thinking.remove();
        addAIMessage("요청 처리 중 문제가 발생했습니다: " + error.message);
    }
}

function openWindow(id) {
    const win = $(id);
    win.classList.add("visible");
    highestZ++;
    win.style.zIndex = highestZ;
}

function closeWindow(id) { $(id).classList.remove("visible"); }

function maximizeWindow(id) {
    const win = $(id);
    win.classList.toggle("maximized");
    highestZ++;
    win.style.zIndex = highestZ;
}

function setupWindowDragging() {
    document.querySelectorAll(".window").forEach(win => {
        const titlebar = win.querySelector(".titlebar");
        let dragging = false, offsetX = 0, offsetY = 0;

        titlebar.addEventListener("pointerdown", e => {
            if (e.target.closest(".window-control") || win.classList.contains("maximized")) return;
            dragging = true;
            offsetX = e.clientX - win.offsetLeft;
            offsetY = e.clientY - win.offsetTop;
            titlebar.setPointerCapture(e.pointerId);
            highestZ++;
            win.style.zIndex = highestZ;
            e.preventDefault();
        });

        titlebar.addEventListener("pointermove", e => {
            if (!dragging) return;
            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;
            const maxX = Math.max(0, window.innerWidth - win.offsetWidth);
            const maxY = Math.max(0, window.innerHeight - 48 - win.offsetHeight);
            win.style.left = Math.max(0, Math.min(x, maxX)) + "px";
            win.style.top = Math.max(0, Math.min(y, maxY)) + "px";
        });

        const stopDragging = e => {
            dragging = false;
            try { if (titlebar.hasPointerCapture(e.pointerId)) titlebar.releasePointerCapture(e.pointerId); } catch {}
        };
        titlebar.addEventListener("pointerup", stopDragging);
        titlebar.addEventListener("pointercancel", stopDragging);
    });
}

function setupWindowResizing() {
    document.querySelectorAll(".window").forEach(win => {
        const handle = win.querySelector(".window-resize-handle");
        if (!handle) return;

        let resizing = false, startX = 0, startY = 0, startWidth = 0, startHeight = 0, startLeft = 0, startTop = 0;
        const MIN_WIDTH = 340, MIN_HEIGHT = 320;

        handle.addEventListener("pointerdown", e => {
            if (win.classList.contains("maximized")) return;
            e.preventDefault();
            e.stopPropagation();
            resizing = true;
            startX = e.clientX;
            startY = e.clientY;
            startWidth = win.offsetWidth;
            startHeight = win.offsetHeight;
            startLeft = win.offsetLeft;
            startTop = win.offsetTop;
            highestZ++;
            win.style.zIndex = highestZ;
            handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener("pointermove", e => {
            if (!resizing) return;
            e.preventDefault();
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            let newWidth = Math.max(MIN_WIDTH, startWidth + dx);
            let newHeight = Math.max(MIN_HEIGHT, startHeight + dy);
            const availableWidth = Math.max(MIN_WIDTH, window.innerWidth - startLeft);
            const availableHeight = Math.max(MIN_HEIGHT, window.innerHeight - 48 - startTop);
            win.style.width = Math.min(newWidth, availableWidth) + "px";
            win.style.height = Math.min(newHeight, availableHeight) + "px";
        });

        const stopResizing = e => {
            resizing = false;
            try { if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId); } catch {}
        };
        handle.addEventListener("pointerup", stopResizing);
        handle.addEventListener("pointercancel", stopResizing);
    });
}

function setupDesktopIcons() {
    document.querySelectorAll(".desktop-icon").forEach(icon => {
        let dragging = false, startX = 0, startY = 0, originalX = 0, originalY = 0;

        icon.addEventListener("pointerdown", e => {
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            originalX = icon.offsetLeft;
            originalY = icon.offsetTop;
            icon.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        icon.addEventListener("pointermove", e => {
            if (!dragging) return;
            icon.style.left = Math.max(0, originalX + (e.clientX - startX)) + "px";
            icon.style.top = Math.max(0, originalY + (e.clientY - startY)) + "px";
        });

        const stopIconDrag = e => {
            if (!dragging) return;
            dragging = false;
            saveIconPositions();
            try { if (icon.hasPointerCapture(e.pointerId)) icon.releasePointerCapture(e.pointerId); } catch {}
        };
        icon.addEventListener("pointerup", stopIconDrag);
        icon.addEventListener("pointercancel", stopIconDrag);

        icon.addEventListener("dblclick", () => {
            const app = icon.dataset.app;
            if (app === "calendar") openWindow("calendarWindow");
            if (app === "ai") openWindow("aiWindow");
            if (app === "family") {
                renderFamily();
                showModal("familyModal");
            }
        });
    });

    loadIconPositions();
}

function saveIconPositions() {
    const data = {};
    document.querySelectorAll(".desktop-icon").forEach(icon => {
        data[icon.dataset.app] = { left: icon.offsetLeft, top: icon.offsetTop };
    });
    localStorage.setItem(STORAGE.iconPositions, JSON.stringify(data));
}

function loadIconPositions() {
    try {
        const data = JSON.parse(localStorage.getItem(STORAGE.iconPositions) || "{}");
        document.querySelectorAll(".desktop-icon").forEach(icon => {
            const pos = data[icon.dataset.app];
            if (pos) {
                icon.style.left = pos.left + "px";
                icon.style.top = pos.top + "px";
            }
        });
    } catch {}
}

function updateClock() {
    const now = new Date();
    const date = now.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric", weekday: "short" });
    const time = now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    $("clock").innerHTML = `${date}<br>${time}`;
}

async function boot() {
    loadSetupValues();
    setupWindowDragging();
    setupWindowResizing();
    setupDesktopIcons();
    updateClock();
    setInterval(updateClock, 1000);

    const connected = await initSupabase();
    if (!connected) return;

    await checkAuth();

boot();
