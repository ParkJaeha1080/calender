<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Windows 11 Family Calendar</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Segoe UI","Noto Sans KR",sans-serif;
    color:#fff;
}

body{
    background:
        radial-gradient(circle at 50% 10%,#3b6fa8 0%,#1b304c 42%,#080d15 100%);
}

/* Desktop */

.desktop{
    position:fixed;
    inset:0;
    padding:22px;
}

.desktop-icons{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.desktop-icon{
    width:90px;
    padding:10px 5px;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
    user-select:none;
}

.desktop-icon:hover{
    background:rgba(255,255,255,.12);
}

.desktop-icon .emoji{
    font-size:40px;
}

.desktop-icon .name{
    margin-top:5px;
    font-size:12px;
    text-shadow:0 1px 5px #000;
}

/* Windows */

.window{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);

    width:min(930px,calc(100vw - 30px));
    height:min(670px,calc(100vh - 75px));

    display:none;
    flex-direction:column;

    overflow:hidden;

    background:rgba(25,31,42,.9);
    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;

    box-shadow:0 30px 90px rgba(0,0,0,.6);
}

.window.active{
    display:flex;
}

.titlebar{
    height:48px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    padding-left:15px;

    background:rgba(35,42,54,.75);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.title{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    font-size:14px;
}

.title-icon{
    font-size:21px;
}

.close{
    width:52px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.close:hover{
    background:#c42b1c;
}

/* AI */

.chat{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

.message{
    display:flex;
    margin-bottom:18px;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:80%;
    padding:13px 17px;
    border-radius:14px;
    line-height:1.5;
    font-size:15px;
    white-space:pre-wrap;
}

.message.ai .bubble{
    background:#292f3a;
}

.message.user .bubble{
    background:#1769d1;
}

.input-area{
    padding:14px;
    background:rgba(15,20,27,.92);
    border-top:1px solid rgba(255,255,255,.08);
}

.input-box{
    display:flex;
    align-items:flex-end;
    padding:6px;

    background:#303742;
    border-radius:10px;
}

#input{
    flex:1;
    min-height:42px;
    max-height:130px;

    padding:10px;

    border:0;
    outline:0;
    resize:none;

    background:transparent;
    color:white;

    font-size:15px;
}

#input::placeholder{
    color:#aeb5c0;
}

.send{
    width:45px;
    height:42px;

    border:0;
    border-radius:8px;

    background:#1769d1;
    color:white;

    font-size:20px;

    cursor:pointer;
}

.send:hover{
    background:#2685e7;
}

.send:disabled{
    opacity:.5;
}

/* API Key */

.setup{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(5,8,13,.85);
    backdrop-filter:blur(15px);
}

.setup-card{
    width:min(500px,calc(100% - 30px));

    padding:30px;

    background:#252c37;

    border:1px solid rgba(255,255,255,.12);
    border-radius:15px;

    box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.setup-card h2{
    margin-top:0;
}

.setup-card p{
    color:#b8bec8;
    font-size:14px;
    line-height:1.5;
}

#apiKey{
    width:100%;

    padding:12px;

    margin-top:8px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;

    outline:0;

    background:#171c24;
    color:white;
}

.save-key{
    width:100%;

    margin-top:12px;
    padding:12px;

    border:0;
    border-radius:8px;

    background:#1769d1;
    color:white;

    cursor:pointer;
    font-size:15px;
}

.save-key:hover{
    background:#2685e7;
}

.key-reset{
    width:100%;

    margin-top:8px;
    padding:10px;

    border:0;
    border-radius:8px;

    background:#303742;
    color:white;

    cursor:pointer;
}

/* Calendar */

.calendar{
    flex:1;
    overflow:auto;
    padding:20px;
}

.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.calendar-header button{
    padding:9px 15px;

    border:0;
    border-radius:7px;

    background:#303742;
    color:white;

    cursor:pointer;
}

.calendar-header button:hover{
    background:#424b58;
}

.month-title{
    font-size:25px;
    font-weight:600;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:6px;
}

.weekday{
    padding:8px;
    text-align:center;
    color:#aaa;
}

.day{
    min-height:90px;
    padding:8px;

    border-radius:8px;

    background:rgba(255,255,255,.045);

    cursor:pointer;
}

.day:hover{
    background:rgba(255,255,255,.1);
}

.day-number{
    font-size:13px;
}

.event{
    margin-top:5px;
    padding:4px 6px;

    border-radius:5px;

    background:#1769d1;

    font-size:11px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    cursor:pointer;
}

/* Taskbar */

.taskbar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    height:55px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:5px;

    background:rgba(20,25,33,.84);
    backdrop-filter:blur(25px);

    border-top:1px solid rgba(255,255,255,.08);
}

.task-icon{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    font-size:23px;

    cursor:pointer;
}

.task-icon:hover{
    background:rgba(255,255,255,.12);
}

/* Mobile */

@media(max-width:600px){

    .window{
        width:100%;
        height:calc(100% - 55px);

        left:0;
        top:0;

        transform:none;

        border-radius:0;
    }

    .bubble{
        max-width:88%;
    }

    .day{
        min-height:65px;
    }
}
</style>
</head>

<body>

<!-- DESKTOP -->

<div class="desktop">

    <div class="desktop-icons">

        <div class="desktop-icon"
             onclick="openWindow('aiWindow')">

            <div class="emoji">🤖</div>

            <div class="name">
                AI 일정 비서
            </div>

        </div>


        <div class="desktop-icon"
             onclick="openWindow('calendarWindow')">

            <div class="emoji">📅</div>

            <div class="name">
                캘린더
            </div>

        </div>

    </div>

</div>


<!-- AI WINDOW -->

<div id="aiWindow"
     class="window">

    <div class="titlebar">

        <div class="title">

            <span class="title-icon">🤖</span>

            <span>
                Gemini AI 일정 비서
            </span>

        </div>

        <div class="close"
             onclick="closeWindow('aiWindow')">

            ✕

        </div>

    </div>


    <div class="chat">

        <div id="messages"
             class="messages">
        </div>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Gemini에게 물어보세요..."
                    onkeydown="handleEnter(event)">
                </textarea>

                <button
                    id="send"
                    class="send"
                    onclick="sendMessage()">

                    ➤

                </button>

            </div>

        </div>

    </div>

</div>


<!-- CALENDAR WINDOW -->

<div id="calendarWindow"
     class="window">

    <div class="titlebar">

        <div class="title">

            <span class="title-icon">
                📅
            </span>

            <span>
                캘린더
            </span>

        </div>

        <div class="close"
             onclick="closeWindow('calendarWindow')">

            ✕

        </div>

    </div>


    <div class="calendar">

        <div class="calendar-header">

            <button onclick="changeMonth(-1)">
                ◀
            </button>

            <div id="monthTitle"
                 class="month-title">
            </div>

            <button onclick="changeMonth(1)">
                ▶
            </button>

        </div>


        <div id="calendarGrid"
             class="calendar-grid">
        </div>

    </div>

</div>


<!-- GEMINI KEY SETUP -->

<div id="setup"
     class="setup">

    <div class="setup-card">

        <h2>🤖 Gemini 설정</h2>

        <p>
            Gemini API 키를 입력해주세요.<br>
            이 키는 이 브라우저에만 저장됩니다.
        </p>

        <input
            id="apiKey"
            type="password"
            placeholder="Gemini API Key">

        <button
            class="save-key"
            onclick="saveApiKey()">

            저장하고 시작

        </button>

        <button
            class="key-reset"
            onclick="clearApiKey()">

            저장된 API 키 삭제

        </button>

    </div>

</div>


<!-- TASKBAR -->

<div class="taskbar">

    <div class="task-icon"
         onclick="openWindow('aiWindow')">

        🤖

    </div>

    <div class="task-icon"
         onclick="openWindow('calendarWindow')">

        📅

    </div>

</div>


<script>

/* ==================================================
   SETTINGS
================================================== */

const EVENT_STORAGE =
    "windows11_calendar_events";

const KEY_STORAGE =
    "windows11_gemini_key";


let events =
    JSON.parse(
        localStorage.getItem(EVENT_STORAGE) || "[]"
    );


let currentMonth =
    new Date();


/* ==================================================
   API KEY
================================================== */

function getApiKey(){

    return localStorage.getItem(
        KEY_STORAGE
    );

}


function saveApiKey(){

    const key =
        document
            .getElementById("apiKey")
            .value
            .trim();


    if(!key){

        alert(
            "Gemini API 키를 입력해주세요."
        );

        return;

    }


    localStorage.setItem(
        KEY_STORAGE,
        key
    );


    document
        .getElementById("setup")
        .style.display = "none";


    openWindow("aiWindow");

}


function clearApiKey(){

    localStorage.removeItem(
        KEY_STORAGE
    );

    document
        .getElementById("apiKey")
        .value = "";


    alert(
        "저장된 Gemini API 키를 삭제했습니다."
    );

}


if(getApiKey()){

    document
        .getElementById("setup")
        .style.display = "none";

}


/* ==================================================
   WINDOWS
================================================== */

function openWindow(id){

    document
        .getElementById(id)
        .classList.add("active");

}


function closeWindow(id){

    document
        .getElementById(id)
        .classList.remove("active");

}


/* ==================================================
   CHAT
================================================== */

function addMessage(
    text,
    type
){

    const messages =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    messages.appendChild(
        row
    );


    messages.scrollTop =
        messages.scrollHeight;


    return row;

}


addMessage(
`안녕하세요! 👋

Gemini 기반 AI 일정 비서입니다.

자연스럽게 말하면 일정으로 만들어 드릴게요.

예:
• 내일 오후 4시 수학 공부 추가해줘
• 8월 30일 오후 7시 가족 외식
• 오늘 일정 보여줘
• 오늘 일정 전부 삭제해줘
• 내일 수학 공부 삭제해줘`,
"ai"
);


/* ==================================================
   ENTER
================================================== */

function handleEnter(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* ==================================================
   SEND TO GEMINI
================================================== */

async function sendMessage(){

    const input =
        document.getElementById(
            "input"
        );


    const send =
        document.getElementById(
            "send"
        );


    const message =
        input.value.trim();


    if(!message)
        return;


    const key =
        getApiKey();


    if(!key){

        document
            .getElementById("setup")
            .style.display = "flex";

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value = "";

    send.disabled = true;


    const loading =
        addMessage(
            "Gemini가 생각 중...",
            "ai"
        );


    try{

        const now =
            new Date();


        const prompt = `
너는 Windows 11 캘린더의 Gemini AI 일정 비서다.

현재 한국 시간:
${now.toLocaleString(
    "ko-KR",
    {
        timeZone:"Asia/Seoul"
    }
)}

현재 저장된 일정:
${JSON.stringify(events)}

사용자 요청:
${message}

반드시 JSON 하나만 반환해라.

일정 추가:

{
  "action":"add",
  "title":"제목",
  "date":"YYYY-MM-DD",
  "time":"HH:MM",
  "desc":"설명",
  "reply":"사용자에게 보여줄 답변"
}

일정 삭제:

{
  "action":"delete",
  "eventIds":["실제 일정 ID"],
  "reply":"사용자에게 보여줄 답변"
}

일반 대화:

{
  "action":"chat",
  "reply":"답변"
}

규칙:

- 오늘/내일/모레는 현재 한국 날짜를 기준으로 계산한다.
- 일정 추가 요청은 add.
- 일정 삭제 요청은 delete.
- "오늘 일정 전부 삭제" 같은 요청은 해당 날짜의 모든 일정 ID를 반환한다.
- 삭제 ID는 반드시 현재 일정 목록에 존재하는 ID만 사용한다.
- 일정 조회 요청은 chat으로 답한다.
- 존재하지 않는 일정 삭제 요청은 chat으로 답한다.
- JSON 외의 문자는 출력하지 않는다.
`;


        const response =
            await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" +
                encodeURIComponent(key),
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        contents:[

                            {

                                role:"user",

                                parts:[

                                    {
                                        text:prompt
                                    }

                                ]

                            }

                        ],

                        generationConfig:{

                            temperature:0.2,

                            responseMimeType:
                                "application/json"

                        }

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data?.error?.message ||
                "Gemini API 오류"
            );

        }


        const resultText =
            data
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;


        if(!resultText){

            throw new Error(
                "Gemini 응답이 없습니다."
            );

        }


        const result =
            JSON.parse(
                resultText
            );


        loading.remove();


        /* ADD */

        if(
            result.action === "add"
        ){

            const event = {

                id:
                    crypto.randomUUID(),

                title:
                    result.title,

                date:
                    result.date,

                time:
                    result.time || "",

                desc:
                    result.desc || "",

                isAI:true

            };


            events.push(
                event
            );


            saveEvents();

            renderCalendar();


            addMessage(
                result.reply ||
                `✅ ${event.title} 일정을 추가했습니다.`,
                "ai"
            );

        }


        /* DELETE */

        else if(
            result.action === "delete"
        ){

            const ids =
                Array.isArray(
                    result.eventIds
                )
                ? result.eventIds
                : [];


            const before =
                events.length;


            events =
                events.filter(
                    event =>
                        !ids.includes(
                            event.id
                        )
                );


            saveEvents();

            renderCalendar();


            const deleted =
                before -
                events.length;


            addMessage(
                result.reply ||
                (
                    deleted
                    ? `🗑️ ${deleted}개의 일정을 삭제했습니다.`
                    : "삭제할 일정을 찾지 못했습니다."
                ),
                "ai"
            );

        }


        /* CHAT */

        else{

            addMessage(
                result.reply ||
                "알겠습니다.",
                "ai"
            );

        }


    }catch(error){

        loading.remove();


        addMessage(
            "❌ 오류가 발생했습니다.\n\n" +
            error.message,
            "ai"
        );

    }


    send.disabled = false;

    input.focus();

}


/* ==================================================
   LOCAL STORAGE
================================================== */

function saveEvents(){

    localStorage.setItem(
        EVENT_STORAGE,
        JSON.stringify(events)
    );

}


/* ==================================================
   CALENDAR
================================================== */

function changeMonth(
    amount
){

    currentMonth.setMonth(
        currentMonth.getMonth() +
        amount
    );


    renderCalendar();

}


function renderCalendar(){

    const grid =
        document.getElementById(
            "calendarGrid"
        );


    const title =
        document.getElementById(
            "monthTitle"
        );


    const year =
        currentMonth.getFullYear();


    const month =
        currentMonth.getMonth();


    title.textContent =
        `${year}년 ${month + 1}월`;


    grid.innerHTML = "";


    const weekdays = [
        "일",
        "월",
        "화",
        "수",
        "목",
        "금",
        "토"
    ];


    weekdays.forEach(
        day => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "weekday";


            element.textContent =
                day;


            grid.appendChild(
                element
            );

        }
    );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i=0;
        i<firstDay;
        i++
    ){

        grid.appendChild(
            document.createElement(
                "div"
            )
        );

    }


    for(
        let day=1;
        day<=days;
        day++
    ){

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        const date =
            `${year}-` +
            `${String(
                month + 1
            ).padStart(2,"0")}-` +
            `${String(
                day
            ).padStart(2,"0")}`;


        events
            .filter(
                event =>
                    event.date === date
            )
            .forEach(
                event => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "event";


                    element.textContent =
                        `${event.time || ""} ${event.title}`;


                    element.title =
                        event.desc || "";


                    element.onclick =
                    function(e){

                        e.stopPropagation();


                        const yes =
                            confirm(
                                `${event.title}\n\n` +
                                `${event.date} ${event.time || ""}\n\n` +
                                `이 일정을 삭제할까요?`
                            );


                        if(!yes)
                            return;


                        events =
                            events.filter(
                                item =>
                                    item.id !==
                                    event.id
                            );


                        saveEvents();

                        renderCalendar();

                    };


                    cell.appendChild(
                        element
                    );

                }
            );


        grid.appendChild(
            cell
        );

    }

}


/* ==================================================
   START
================================================== */

renderCalendar();

</script>

</body>
</html>
