<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Windows 11 Family Calendar</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    color:white;
}


/* =========================================================
   DESKTOP
========================================================= */

body{

    background:
        radial-gradient(
            circle at 50% 5%,
            #477eb8 0%,
            #243d5a 35%,
            #111b29 70%,
            #070b11 100%
        );

}

.desktop{

    position:fixed;

    inset:0;

    overflow:hidden;

}


/* =========================================================
   DESKTOP ICONS
========================================================= */

.desktop-icons{

    position:absolute;

    inset:0;

    pointer-events:none;

}


.desktop-icon{

    position:absolute;

    width:90px;

    min-height:95px;

    padding:8px 5px;

    border-radius:8px;

    text-align:center;

    user-select:none;

    pointer-events:auto;

    touch-action:none;

    cursor:default;

    transition:
        background .12s,
        transform .12s;

}


.desktop-icon:hover{

    background:
        rgba(255,255,255,.11);

}


.desktop-icon.dragging{

    background:
        rgba(255,255,255,.20);

    transform:
        scale(1.03);

}


.icon-image{

    width:52px;

    height:52px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    font-size:34px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.06)
        );

    border:
        1px solid
        rgba(255,255,255,.15);

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.3);

}


.desktop-icon[data-icon="ai"]
.icon-image{

    background:
        linear-gradient(
            145deg,
            #318bff,
            #1254b7
        );

}


.desktop-icon[data-icon="calendar"]
.icon-image{

    background:
        linear-gradient(
            145deg,
            #ff5b5b,
            #ad202b
        );

}


.desktop-icon .name{

    margin-top:7px;

    font-size:12px;

    line-height:16px;

    text-shadow:
        0 1px 5px #000;

    word-break:keep-all;

}


/* =========================================================
   WINDOWS
========================================================= */

.window{

    position:absolute;

    left:50%;

    top:45%;

    transform:
        translate(-50%,-50%);

    width:
        min(930px,calc(100vw - 30px));

    height:
        min(670px,calc(100vh - 75px));

    min-width:420px;

    min-height:300px;

    max-width:
        calc(100vw - 20px);

    max-height:
        calc(100vh - 65px);

    display:none;

    flex-direction:column;

    overflow:hidden;

    background:
        rgba(25,31,42,.92);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:12px;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.60);

}


/* 활성 */

.window.active{

    display:flex;

}


/* =========================================================
   CUSTOM RESIZE HANDLE
========================================================= */

/*
   브라우저 기본 resize 대신
   직접 만든 resize handle을 사용한다.
*/

.resize-handle{

    position:absolute;

    right:0;

    bottom:0;

    width:24px;

    height:24px;

    z-index:100;

    cursor:nwse-resize;

}


/* Windows 느낌의 작은 점 */

.resize-handle::after{

    content:"";

    position:absolute;

    right:5px;

    bottom:5px;

    width:11px;

    height:11px;

    background:
        linear-gradient(
            135deg,
            transparent 45%,
            rgba(255,255,255,.65) 46%,
            rgba(255,255,255,.65) 52%,
            transparent 53%
        );

    opacity:.7;

}


/* =========================================================
   MINIMIZED
========================================================= */

.window.minimized{

    display:none;

}


/* =========================================================
   MAXIMIZED
========================================================= */

.window.maximized{

    left:0 !important;

    top:0 !important;

    width:100% !important;

    height:
        calc(100% - 55px) !important;

    min-width:0 !important;

    min-height:0 !important;

    max-width:none !important;

    max-height:none !important;

    transform:none !important;

    border-radius:0;

}


/* =========================================================
   TITLE BAR
========================================================= */

.titlebar{

    height:48px;

    min-height:48px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    padding-left:15px;

    background:
        rgba(35,42,54,.80);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    cursor:default;

    user-select:none;

    touch-action:none;

}


/* 실제 드래그 영역 */

.title{

    display:flex;

    align-items:center;

    gap:10px;

    flex:1;

    min-width:0;

    height:100%;

    cursor:move;

}


.title-icon{

    width:25px;

    height:25px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

    flex-shrink:0;

}


.title-text{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:14px;

    font-weight:500;

}


/* =========================================================
   WINDOW BUTTONS
========================================================= */

.window-buttons{

    height:48px;

    display:flex;

    align-items:stretch;

    flex-shrink:0;

}


.window-button{

    width:46px;

    height:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:15px;

    cursor:pointer;

    transition:
        background .1s;

}


.window-button:hover{

    background:
        rgba(255,255,255,.10);

}


.window-button.close:hover{

    background:#c42b1c;

}


.window-button.minimize{

    font-size:17px;

}


.window-button.maximize{

    font-size:14px;

}


/* =========================================================
   AI CHAT
========================================================= */

.chat{

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

}


.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:25px;

    scrollbar-width:thin;

}


.message{

    display:flex;

    margin-bottom:18px;

}


.message.user{

    justify-content:flex-end;

}


.bubble{

    max-width:80%;

    padding:13px 17px;

    border-radius:14px;

    line-height:1.5;

    font-size:15px;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

}


.message.ai .bubble{

    background:#292f3a;

}


.message.user .bubble{

    background:#1769d1;

}


/* =========================================================
   INPUT
========================================================= */

.input-area{

    padding:14px;

    background:
        rgba(15,20,27,.92);

    border-top:
        1px solid
        rgba(255,255,255,.08);

}


.input-box{

    display:flex;

    align-items:flex-end;

    padding:6px;

    background:#303742;

    border-radius:10px;

}


#input{

    flex:1;

    min-height:42px;

    max-height:130px;

    padding:10px;

    border:0;

    outline:0;

    resize:none;

    background:transparent;

    color:white;

    font-size:15px;

    font-family:inherit;

}


#input::placeholder{

    color:#aeb5c0;

}


.send{

    width:45px;

    height:42px;

    flex-shrink:0;

    border:0;

    border-radius:8px;

    background:#1769d1;

    color:white;

    font-size:20px;

    cursor:pointer;

}


.send:hover{

    background:#2685e7;

}


.send:disabled{

    opacity:.5;

    cursor:default;

}


/* =========================================================
   CALENDAR
========================================================= */

.calendar{

    flex:1;

    min-height:0;

    overflow:auto;

    padding:20px;

}


.calendar-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.calendar-header button{

    padding:9px 15px;

    border:0;

    border-radius:7px;

    background:#303742;

    color:white;

    cursor:pointer;

    font-size:14px;

}


.calendar-header button:hover{

    background:#424b58;

}


.month-title{

    font-size:25px;

    font-weight:600;

}


.calendar-grid{

    display:grid;

    grid-template-columns:
        repeat(7,minmax(0,1fr));

    gap:6px;

}


.weekday{

    padding:8px;

    text-align:center;

    color:#aaa;

    font-size:13px;

}


.day{

    min-height:90px;

    padding:8px;

    border-radius:8px;

    background:
        rgba(255,255,255,.045);

    overflow:hidden;

}


.day:hover{

    background:
        rgba(255,255,255,.08);

}


.day-number{

    font-size:13px;

    margin-bottom:2px;

}


.event{

    margin-top:5px;

    padding:4px 6px;

    border-radius:5px;

    background:#1769d1;

    font-size:11px;

    line-height:15px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    cursor:pointer;

}


.event:hover{

    background:#2685e7;

}


/* =========================================================
   SETUP
========================================================= */

.setup{

    position:fixed;

    inset:0;

    z-index:10000;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(5,8,13,.85);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

}


.setup-card{

    width:
        min(500px,calc(100% - 30px));

    padding:30px;

    background:#252c37;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:15px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.6);

}


.setup-card h2{

    margin-top:0;

}


.setup-card p{

    color:#b8bec8;

    font-size:14px;

    line-height:1.5;

}


#apiKey{

    width:100%;

    padding:12px;

    margin-top:8px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:8px;

    outline:0;

    background:#171c24;

    color:white;

    font-family:monospace;

}


.save-key{

    width:100%;

    margin-top:12px;

    padding:12px;

    border:0;

    border-radius:8px;

    background:#1769d1;

    color:white;

    cursor:pointer;

    font-size:15px;

}


.save-key:hover{

    background:#2685e7;

}


.key-reset{

    width:100%;

    margin-top:8px;

    padding:10px;

    border:0;

    border-radius:8px;

    background:#303742;

    color:white;

    cursor:pointer;

}


/* =========================================================
   TASKBAR
========================================================= */

.taskbar{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:55px;

    z-index:9000;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:5px;

    background:
        rgba(20,25,33,.84);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    border-top:
        1px solid
        rgba(255,255,255,.08);

}


.task-icon{

    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    font-size:23px;

    cursor:pointer;

}


.task-icon:hover{

    background:
        rgba(255,255,255,.12);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .desktop-icon{

        width:78px;

        min-height:82px;

    }


    .icon-image{

        width:45px;
        height:45px;

        font-size:29px;

    }


    .desktop-icon .name{

        font-size:11px;

    }


    .window{

        width:100%;

        height:
            calc(100% - 55px);

        left:0;

        top:0;

        transform:none;

        min-width:0;

        min-height:0;

        max-width:none;

        max-height:none;

        border-radius:0;

    }


    .resize-handle{

        display:none;

    }


    .title{

        cursor:default;

    }


    .bubble{

        max-width:88%;

    }


    .day{

        min-height:65px;

        padding:6px;

    }


    .calendar{

        padding:10px;

    }


    .calendar-grid{

        gap:3px;

    }


    .weekday{

        padding:5px 2px;

    }


    .month-title{

        font-size:21px;

    }


    .window-button{

        width:44px;

    }

}


/* =========================================================
   VERY SMALL
========================================================= */

@media(max-width:380px){

    .window-button{

        width:40px;

    }


    .bubble{

        font-size:14px;

    }


    .day{

        min-height:55px;

    }


    .event{

        font-size:10px;

    }

}

</style>
</head>


<body>


<!-- =========================================================
     DESKTOP
========================================================= -->

<div class="desktop">

    <div class="desktop-icons">


        <div
            class="desktop-icon"
            data-icon="ai"
            style="left:20px;top:20px"
        >

            <div class="icon-image">
                🤖
            </div>

            <div class="name">
                AI 일정 비서
            </div>

        </div>


        <div
            class="desktop-icon"
            data-icon="calendar"
            style="left:20px;top:125px"
        >

            <div class="icon-image">
                📅
            </div>

            <div class="name">
                캘린더
            </div>

        </div>


    </div>

</div>


<!-- =========================================================
     AI WINDOW
========================================================= -->

<div
    id="aiWindow"
    class="window"
>


    <div class="titlebar">


        <div class="title">

            <span class="title-icon">
                🤖
            </span>

            <span class="title-text">
                Gemini AI 일정 비서
            </span>

        </div>


        <div class="window-buttons">


            <div
                class="window-button minimize"
                data-action="minimize"
                title="최소화"
            >
                −
            </div>


            <div
                class="window-button maximize"
                data-action="maximize"
                title="최대화"
            >
                □
            </div>


            <div
                class="window-button close"
                data-action="close"
                title="닫기"
            >
                ✕
            </div>


        </div>

    </div>


    <div class="chat">


        <div
            id="messages"
            class="messages"
        ></div>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Gemini에게 물어보세요..."
                    onkeydown="handleEnter(event)"
                ></textarea>


                <button
                    id="send"
                    class="send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>


    <div class="resize-handle"></div>

</div>


<!-- =========================================================
     CALENDAR WINDOW
========================================================= -->

<div
    id="calendarWindow"
    class="window"
>


    <div class="titlebar">


        <div class="title">

            <span class="title-icon">
                📅
            </span>

            <span class="title-text">
                캘린더
            </span>

        </div>


        <div class="window-buttons">


            <div
                class="window-button minimize"
                data-action="minimize"
                title="최소화"
            >
                −
            </div>


            <div
                class="window-button maximize"
                data-action="maximize"
                title="최대화"
            >
                □
            </div>


            <div
                class="window-button close"
                data-action="close"
                title="닫기"
            >
                ✕
            </div>


        </div>

    </div>


    <div class="calendar">


        <div class="calendar-header">


            <button onclick="changeMonth(-1)">
                ◀
            </button>


            <div
                id="monthTitle"
                class="month-title"
            ></div>


            <button onclick="changeMonth(1)">
                ▶
            </button>


        </div>


        <div
            id="calendarGrid"
            class="calendar-grid"
        ></div>


    </div>


    <div class="resize-handle"></div>

</div>


<!-- =========================================================
     GEMINI SETUP
========================================================= -->

<div
    id="setup"
    class="setup"
>


    <div class="setup-card">


        <h2>
            🤖 Gemini 설정
        </h2>


        <p>
            Gemini API 키를 입력해주세요.<br>
            입력한 키는 이 브라우저의 localStorage에만 저장됩니다.
        </p>


        <input
            id="apiKey"
            type="password"
            placeholder="Gemini API Key"
            autocomplete="off"
        >


        <button
            class="save-key"
            onclick="saveApiKey()"
        >
            저장하고 시작
        </button>


        <button
            class="key-reset"
            onclick="clearApiKey()"
        >
            저장된 API 키 삭제
        </button>


    </div>

</div>


<!-- =========================================================
     TASKBAR
========================================================= -->

<div class="taskbar">


    <div
        class="task-icon"
        onclick="openWindow('aiWindow')"
        title="AI 일정 비서"
    >
        🤖
    </div>


    <div
        class="task-icon"
        onclick="openWindow('calendarWindow')"
        title="캘린더"
    >
        📅
    </div>


</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const EVENT_STORAGE =
    "windows11_calendar_events";

const KEY_STORAGE =
    "windows11_gemini_key";

const ICON_STORAGE =
    "windows11_desktop_icon_positions";

const WINDOW_STORAGE =
    "windows11_window_positions";


/* =========================================================
   DATA
========================================================= */

let events =
    loadEvents();

let currentMonth =
    new Date();

let highestZ =
    100;


/* =========================================================
   EVENTS
========================================================= */

function loadEvents(){

    try{

        const data =
            localStorage.getItem(
                EVENT_STORAGE
            );

        const parsed =
            JSON.parse(
                data || "[]"
            );

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch{

        return [];

    }

}


function saveEvents(){

    localStorage.setItem(
        EVENT_STORAGE,
        JSON.stringify(events)
    );

}


/* =========================================================
   API KEY
========================================================= */

function getApiKey(){

    return localStorage.getItem(
        KEY_STORAGE
    );

}


function saveApiKey(){

    const input =
        document.getElementById(
            "apiKey"
        );

    const key =
        input.value.trim();

    if(!key){

        alert(
            "Gemini API 키를 입력해주세요."
        );

        return;

    }

    localStorage.setItem(
        KEY_STORAGE,
        key
    );

    document.getElementById(
        "setup"
    ).style.display =
        "none";

    openWindow(
        "aiWindow"
    );

}


function clearApiKey(){

    localStorage.removeItem(
        KEY_STORAGE
    );

    document.getElementById(
        "apiKey"
    ).value =
        "";

    alert(
        "저장된 Gemini API 키를 삭제했습니다."
    );

}


if(getApiKey()){

    document.getElementById(
        "setup"
    ).style.display =
        "none";

}


/* =========================================================
   WINDOW Z-INDEX
========================================================= */

function bringToFront(win){

    highestZ++;

    win.style.zIndex =
        highestZ;

}


/* =========================================================
   OPEN
========================================================= */

function openWindow(id){

    const win =
        document.getElementById(id);

    if(!win)
        return;

    win.classList.add(
        "active"
    );

    win.classList.remove(
        "minimized"
    );

    bringToFront(win);

}


/* =========================================================
   CLOSE
========================================================= */

function closeWindow(id){

    const win =
        document.getElementById(id);

    if(!win)
        return;

    win.classList.remove(
        "active"
    );

    win.classList.remove(
        "minimized"
    );

}


/* =========================================================
   MINIMIZE
========================================================= */

function minimizeWindow(win){

    win.classList.remove(
        "active"
    );

    win.classList.add(
        "minimized"
    );

}


/* =========================================================
   MAXIMIZE
========================================================= */

function maximizeWindow(win){

    if(
        win.classList.contains(
            "maximized"
        )
    ){

        restoreWindow(win);

        return;

    }


    const rect =
        win.getBoundingClientRect();


    win.dataset.restoreLeft =
        rect.left;

    win.dataset.restoreTop =
        rect.top;

    win.dataset.restoreWidth =
        rect.width;

    win.dataset.restoreHeight =
        rect.height;


    win.classList.add(
        "maximized"
    );


    bringToFront(win);

}


/* =========================================================
   RESTORE
========================================================= */

function restoreWindow(win){

    win.classList.remove(
        "maximized"
    );


    if(
        win.dataset.restoreWidth
    ){

        win.style.width =
            win.dataset.restoreWidth +
            "px";

        win.style.height =
            win.dataset.restoreHeight +
            "px";

        win.style.left =
            win.dataset.restoreLeft +
            "px";

        win.style.top =
            win.dataset.restoreTop +
            "px";

        win.style.transform =
            "none";

    }


    bringToFront(win);

}


/* =========================================================
   WINDOW BUTTONS
========================================================= */

document
.querySelectorAll(".window")
.forEach(win => {


    win.addEventListener(
        "pointerdown",
        () => {

            bringToFront(win);

        }
    );


    win.querySelectorAll(
        ".window-button"
    )
    .forEach(button => {


        button.addEventListener(
            "pointerdown",
            e => {

                e.stopPropagation();

            }
        );


        button.addEventListener(
            "click",
            e => {

                e.stopPropagation();


                const action =
                    button.dataset.action;


                if(
                    action === "close"
                ){

                    closeWindow(
                        win.id
                    );

                }


                else if(
                    action === "minimize"
                ){

                    minimizeWindow(
                        win
                    );

                }


                else if(
                    action === "maximize"
                ){

                    maximizeWindow(
                        win
                    );

                }

            }
        );

    });

});


/* =========================================================
   WINDOW DRAG
   끊김 방지:
   pointermove를 titlebar가 아니라
   document에서 추적
========================================================= */

document
.querySelectorAll(".window")
.forEach(win => {


    const titlebar =
        win.querySelector(
            ".titlebar"
        );


    const title =
        win.querySelector(
            ".title"
        );


    let dragging =
        false;


    let dragPointerId =
        null;


    let startX =
        0;

    let startY =
        0;

    let startLeft =
        0;

    let startTop =
        0;


    title.addEventListener(
        "pointerdown",
        e => {


            if(
                e.button !== 0
            )
                return;


            if(
                win.classList.contains(
                    "maximized"
                )
            )
                return;


            const rect =
                win.getBoundingClientRect();


            /*
             * 가운데 정렬 transform 제거
             */

            win.style.left =
                rect.left + "px";

            win.style.top =
                rect.top + "px";

            win.style.transform =
                "none";


            startX =
                e.clientX;

            startY =
                e.clientY;

            startLeft =
                rect.left;

            startTop =
                rect.top;


            dragging =
                true;

            dragPointerId =
                e.pointerId;


            title.setPointerCapture(
                e.pointerId
            );


            document.body.style.userSelect =
                "none";

            document.body.style.cursor =
                "grabbing";


            bringToFront(win);


            e.preventDefault();

        }
    );


    document.addEventListener(
        "pointermove",
        e => {


            if(!dragging)
                return;


            if(
                e.pointerId !==
                dragPointerId
            )
                return;


            const dx =
                e.clientX -
                startX;


            const dy =
                e.clientY -
                startY;


            let x =
                startLeft + dx;


            let y =
                startTop + dy;


            const rect =
                win.getBoundingClientRect();


            /*
             * 최소 80px 정도는
             * 화면에 남겨둔다.
             */

            const visible =
                80;


            const maxLeft =
                window.innerWidth -
                visible;


            const maxTop =
                window.innerHeight -
                55 -
                35;


            x =
                Math.max(
                    -rect.width +
                    visible,
                    Math.min(
                        x,
                        maxLeft
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        y,
                        maxTop
                    )
                );


            win.style.left =
                x + "px";


            win.style.top =
                y + "px";

        }
    );


    document.addEventListener(
        "pointerup",
        e => {


            if(!dragging)
                return;


            if(
                e.pointerId !==
                dragPointerId
            )
                return;


            dragging =
                false;


            dragPointerId =
                null;


            document.body.style.userSelect =
                "";

            document.body.style.cursor =
                "";


            try{

                title.releasePointerCapture(
                    e.pointerId
                );

            }catch{}


            saveWindowPosition(
                win
            );

        }
    );


    document.addEventListener(
        "pointercancel",
        e => {


            if(
                e.pointerId !==
                dragPointerId
            )
                return;


            dragging =
                false;

            dragPointerId =
                null;


            document.body.style.userSelect =
                "";

            document.body.style.cursor =
                "";

        }
    );

});


/* =========================================================
   WINDOW RESIZE
========================================================= */

document
.querySelectorAll(".window")
.forEach(win => {


    const handle =
        win.querySelector(
            ".resize-handle"
        );


    let resizing =
        false;


    let resizePointerId =
        null;


    let startX =
        0;

    let startY =
        0;

    let startWidth =
        0;

    let startHeight =
        0;


    handle.addEventListener(
        "pointerdown",
        e => {


            if(
                e.button !== 0
            )
                return;


            if(
                win.classList.contains(
                    "maximized"
                )
            )
                return;


            const rect =
                win.getBoundingClientRect();


            /*
             * transform 제거
             */

            win.style.left =
                rect.left + "px";

            win.style.top =
                rect.top + "px";

            win.style.transform =
                "none";


            startX =
                e.clientX;

            startY =
                e.clientY;

            startWidth =
                rect.width;

            startHeight =
                rect.height;


            resizing =
                true;

            resizePointerId =
                e.pointerId;


            handle.setPointerCapture(
                e.pointerId
            );


            document.body.style.userSelect =
                "none";

            document.body.style.cursor =
                "nwse-resize";


            bringToFront(win);


            e.preventDefault();

            e.stopPropagation();

        }
    );


    document.addEventListener(
        "pointermove",
        e => {


            if(!resizing)
                return;


            if(
                e.pointerId !==
                resizePointerId
            )
                return;


            const dx =
                e.clientX -
                startX;


            const dy =
                e.clientY -
                startY;


            const minWidth =
                420;


            const minHeight =
                300;


            const maxWidth =
                window.innerWidth -
                20;


            const maxHeight =
                window.innerHeight -
                65;


            let width =
                startWidth + dx;


            let height =
                startHeight + dy;


            width =
                Math.max(
                    minWidth,
                    Math.min(
                        width,
                        maxWidth
                    )
                );


            height =
                Math.max(
                    minHeight,
                    Math.min(
                        height,
                        maxHeight
                    )
                );


            win.style.width =
                width + "px";


            win.style.height =
                height + "px";

        }
    );


    document.addEventListener(
        "pointerup",
        e => {


            if(!resizing)
                return;


            if(
                e.pointerId !==
                resizePointerId
            )
                return;


            resizing =
                false;

            resizePointerId =
                null;


            document.body.style.userSelect =
                "";

            document.body.style.cursor =
                "";


            try{

                handle.releasePointerCapture(
                    e.pointerId
                );

            }catch{}


            saveWindowPosition(
                win
            );

        }
    );


    document.addEventListener(
        "pointercancel",
        e => {


            if(
                e.pointerId !==
                resizePointerId
            )
                return;


            resizing =
                false;

            resizePointerId =
                null;


            document.body.style.userSelect =
                "";

            document.body.style.cursor =
                "";

        }
    );

});


/* =========================================================
   SAVE WINDOW
========================================================= */

function saveWindowPosition(win){

    if(
        win.classList.contains(
            "maximized"
        )
    )
        return;


    const rect =
        win.getBoundingClientRect();


    let positions;


    try{

        positions =
            JSON.parse(
                localStorage.getItem(
                    WINDOW_STORAGE
                ) || "{}"
            );

    }catch{

        positions = {};

    }


    positions[win.id] = {

        left:
            rect.left,

        top:
            rect.top,

        width:
            rect.width,

        height:
            rect.height

    };


    localStorage.setItem(
        WINDOW_STORAGE,
        JSON.stringify(
            positions
        )
    );

}


/* =========================================================
   RESTORE WINDOW POSITIONS
========================================================= */

function restoreSavedWindows(){

    if(
        window.innerWidth <= 600
    )
        return;


    let positions;


    try{

        positions =
            JSON.parse(
                localStorage.getItem(
                    WINDOW_STORAGE
                ) || "{}"
            );

    }catch{

        positions = {};

    }


    document
    .querySelectorAll(".window")
    .forEach(win => {


        const data =
            positions[win.id];


        if(!data)
            return;


        if(
            typeof data.left !==
            "number"
        )
            return;


        if(
            typeof data.top !==
            "number"
        )
            return;


        win.style.left =
            data.left + "px";


        win.style.top =
            data.top + "px";


        if(
            typeof data.width ===
            "number"
        ){

            win.style.width =
                data.width + "px";

        }


        if(
            typeof data.height ===
            "number"
        ){

            win.style.height =
                data.height + "px";

        }


        win.style.transform =
            "none";

    });

}


restoreSavedWindows();


/* =========================================================
   DESKTOP ICON DRAG
========================================================= */

let iconPositions;


try{

    iconPositions =
        JSON.parse(
            localStorage.getItem(
                ICON_STORAGE
            ) || "{}"
        );

}catch{

    iconPositions = {};

}


document
.querySelectorAll(".desktop-icon")
.forEach(icon => {


    const id =
        icon.dataset.icon;


    if(
        iconPositions[id]
    ){

        icon.style.left =
            iconPositions[id].x +
            "px";

        icon.style.top =
            iconPositions[id].y +
            "px";

    }


    let dragging =
        false;


    let moved =
        false;


    let pointerId =
        null;


    let startX =
        0;

    let startY =
        0;

    let startLeft =
        0;

    let startTop =
        0;


    icon.addEventListener(
        "pointerdown",
        e => {


            if(
                e.button !== 0
            )
                return;


            dragging =
                true;

            moved =
                false;

            pointerId =
                e.pointerId;


            startX =
                e.clientX;

            startY =
                e.clientY;


            startLeft =
                parseFloat(
                    icon.style.left
                ) || 0;


            startTop =
                parseFloat(
                    icon.style.top
                ) || 0;


            icon.classList.add(
                "dragging"
            );


            icon.setPointerCapture(
                e.pointerId
            );


            e.preventDefault();

        }
    );


    icon.addEventListener(
        "pointermove",
        e => {


            if(!dragging)
                return;


            if(
                e.pointerId !==
                pointerId
            )
                return;


            const dx =
                e.clientX -
                startX;


            const dy =
                e.clientY -
                startY;


            if(
                Math.abs(dx) > 4 ||
                Math.abs(dy) > 4
            ){

                moved =
                    true;

            }


            let x =
                startLeft + dx;


            let y =
                startTop + dy;


            const maxX =
                window.innerWidth -
                icon.offsetWidth;


            const maxY =
                window.innerHeight -
                55 -
                icon.offsetHeight;


            x =
                Math.max(
                    0,
                    Math.min(
                        x,
                        maxX
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        y,
                        maxY
                    )
                );


            icon.style.left =
                x + "px";


            icon.style.top =
                y + "px";

        }
    );


    icon.addEventListener(
        "pointerup",
        e => {


            if(!dragging)
                return;


            dragging =
                false;


            pointerId =
                null;


            icon.classList.remove(
                "dragging"
            );


            try{

                icon.releasePointerCapture(
                    e.pointerId
                );

            }catch{}


            const x =
                parseFloat(
                    icon.style.left
                ) || 0;


            const y =
                parseFloat(
                    icon.style.top
                ) || 0;


            iconPositions[id] = {

                x:x,

                y:y

            };


            localStorage.setItem(
                ICON_STORAGE,
                JSON.stringify(
                    iconPositions
                )
            );


            if(!moved){

                if(
                    id === "ai"
                ){

                    openWindow(
                        "aiWindow"
                    );

                }


                if(
                    id === "calendar"
                ){

                    openWindow(
                        "calendarWindow"
                    );

                }

            }

        }
    );


    icon.addEventListener(
        "pointercancel",
        () => {

            dragging =
                false;

            pointerId =
                null;

            icon.classList.remove(
                "dragging"
            );

        }
    );

});


/* =========================================================
   AI MESSAGE
========================================================= */

function addMessage(
    text,
    type
){

    const messages =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );


    messages.appendChild(
        row
    );


    messages.scrollTop =
        messages.scrollHeight;


    return row;

}

/* =========================================================
   GEMINI
========================================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "input"
        );


    const send =
        document.getElementById(
            "send"
        );


    const message =
        input.value.trim();


    if(!message)
        return;


    const key =
        getApiKey();


    if(!key){

        document.getElementById(
            "setup"
        ).style.display =
            "flex";

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value =
        "";


    send.disabled =
        true;


    const loading =
        addMessage(
            "Gemini가 생각 중...",
            "ai"
        );


    try{

        const now =
            new Date();


        const prompt =
`
너는 Windows 11 캘린더의 Gemini AI 일정 비서다.

현재 한국 시간:
${now.toLocaleString(
    "ko-KR",
    {
        timeZone:"Asia/Seoul"
    }
)}

현재 저장된 일정:
${JSON.stringify(events)}

사용자 요청:
${message}

반드시 JSON 하나만 반환해라.

일정 추가:

{
  "action":"add",
  "title":"제목",
  "date":"YYYY-MM-DD",
  "time":"HH:MM",
  "desc":"설명",
  "reply":"사용자에게 보여줄 답변"
}

일정 삭제:

{
  "action":"delete",
  "eventIds":["실제 일정 ID"],
  "reply":"사용자에게 보여줄 답변"
}

일반 대화:

{
  "action":"chat",
  "reply":"답변"
}

규칙:

- 오늘/내일/모레는 현재 한국 날짜를 기준으로 계산한다.
- 일정 추가 요청은 add.
- 일정 삭제 요청은 delete.
- 오늘 일정 전부 삭제는 오늘 날짜의 모든 일정 ID를 반환한다.
- 내일 일정 전부 삭제는 내일 날짜의 모든 일정 ID를 반환한다.
- 삭제 ID는 반드시 현재 저장된 일정의 실제 ID만 사용한다.
- 일정 조회 요청은 chat으로 답한다.
- 존재하지 않는 일정 삭제 요청은 chat으로 답한다.
- JSON 외의 문자는 출력하지 않는다.
`;


        const response =
            await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" +
                encodeURIComponent(key),
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            contents:[

                                {

                                    role:"user",

                                    parts:[

                                        {
                                            text:
                                                prompt
                                        }

                                    ]

                                }

                            ],

                            generationConfig:{

                                temperature:
                                    0.2,

                                responseMimeType:
                                    "application/json"

                            }

                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data?.error?.message ||
                "Gemini API 오류"
            );

        }


        const resultText =
            data
            ?.candidates?.[0]
            ?.content?.parts?.[0]
            ?.text;


        if(!resultText){

            throw new Error(
                "Gemini 응답이 없습니다."
            );

        }


        const result =
            JSON.parse(
                resultText
            );


        loading.remove();


        /* ADD */

        if(
            result.action ===
            "add"
        ){

            if(
                !result.title ||
                !result.date
            ){

                throw new Error(
                    "Gemini가 올바른 일정 정보를 반환하지 않았습니다."
                );

            }


            const event = {

                id:
                    crypto.randomUUID(),

                title:
                    result.title,

                date:
                    result.date,

                time:
                    result.time || "",

                desc:
                    result.desc || "",

                isAI:
                    true

            };


            events.push(
                event
            );


            saveEvents();

            renderCalendar();


            addMessage(
                result.reply ||
                `✅ ${event.title} 일정을 추가했습니다.`,
                "ai"
            );

        }


        /* DELETE */

        else if(
            result.action ===
            "delete"
        ){

            const ids =
                Array.isArray(
                    result.eventIds
                )
                ? result.eventIds
                : [];


            const before =
                events.length;


            events =
                events.filter(
                    event =>
                        !ids.includes(
                            event.id
                        )
                );


            const deleted =
                before -
                events.length;


            saveEvents();

            renderCalendar();


            addMessage(
                result.reply ||
                (
                    deleted
                    ? `🗑️ ${deleted}개의 일정을 삭제했습니다.`
                    : "삭제할 일정을 찾지 못했습니다."
                ),
                "ai"
            );

        }


        /* CHAT */

        else{

            addMessage(
                result.reply ||
                "알겠습니다.",
                "ai"
            );

        }

    }
    catch(error){

        loading.remove();


        addMessage(
            "❌ 오류가 발생했습니다.\n\n" +
            error.message,
            "ai"
        );

    }


    send.disabled =
        false;


    input.focus();

}


/* =========================================================
   CALENDAR MONTH
========================================================= */

function changeMonth(
    amount
){

    currentMonth.setMonth(
        currentMonth.getMonth() +
        amount
    );


    renderCalendar();

}


/* =========================================================
   CALENDAR RENDER
========================================================= */

function renderCalendar(){

    const grid =
        document.getElementById(
            "calendarGrid"
        );


    const title =
        document.getElementById(
            "monthTitle"
        );


    const year =
        currentMonth.getFullYear();


    const month =
        currentMonth.getMonth();


    title.textContent =
        `${year}년 ${month + 1}월`;


    grid.innerHTML =
        "";


    const weekdays = [

        "일",
        "월",
        "화",
        "수",
        "목",
        "금",
        "토"

    ];


    weekdays.forEach(
        day => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "weekday";


            element.textContent =
                day;


            grid.appendChild(
                element
            );

        }
    );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i=0;
        i<firstDay;
        i++
    ){

        grid.appendChild(
            document.createElement(
                "div"
            )
        );

    }


    for(
        let day=1;
        day<=days;
        day++
    ){

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        const date =
            `${year}-` +
            `${String(
                month + 1
            ).padStart(2,"0")}-` +
            `${String(
                day
            ).padStart(2,"0")}`;


        events
        .filter(
            event =>
                event.date === date
        )
        .forEach(
            event => {


                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "event";


                element.textContent =
                    `${event.time || ""} ${event.title}`;


                element.title =
                    event.desc ||
                    "";


                element.onclick =
                function(e){

                    e.stopPropagation();


                    const yes =
                        confirm(
                            `${event.title}\n\n` +
                            `${event.date} ${event.time || ""}\n\n` +
                            `${event.desc || ""}\n\n` +
                            `이 일정을 삭제할까요?`
                        );


                    if(!yes)
                        return;


                    events =
                        events.filter(
                            item =>
                                item.id !==
                                event.id
                        );


                    saveEvents();

                    renderCalendar();

                };


                cell.appendChild(
                    element
                );

            }
        );


        grid.appendChild(
            cell
        );

    }

}


/* =========================================================
   START
========================================================= */

renderCalendar();

</script>
