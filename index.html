<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Windows 11 Calendar OS</title>

<style>
:root {
  --win-bg:#0b1320;
  --taskbar-bg:#161b22;
  --win-surface:#1c2128;
  --win-border:rgba(255,255,255,.25);
  --accent:#0078d4;
  --text-main:#f0f6fc;
  --text-muted:#8b949e;
  --card-border:rgba(255,255,255,.15);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

html,body {
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  background:radial-gradient(circle at 50% 120%,#1e3c72 0%,#172a45 40%,#0b1320 100%);
  color:var(--text-main);
}

/* ================= DESKTOP ================= */

#desktop {
  position:absolute;
  inset:0 0 80px 0;
  padding:16px;
  display:flex;
  flex-direction:column;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:16px;
}

.desktop-icon {
  width:88px;
  height:94px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-radius:8px;
  cursor:pointer;
  text-align:center;
}

.desktop-icon:active {
  background:rgba(255,255,255,.2);
  transform:scale(.95);
}

.icon-box {
  width:48px;
  height:48px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}

.desktop-icon span {
  font-size:12px;
  color:white;
  text-shadow:0 1px 4px #000;
}

/* ================= WINDOW ================= */

.window {
  position:absolute;
  min-width:300px;
  min-height:380px;
  width:680px;
  height:540px;
  max-width:95vw;
  max-height:calc(100dvh - 90px);

  background:var(--win-surface);
  border:1px solid var(--win-border);
  border-radius:12px;

  box-shadow:0 24px 48px rgba(0,0,0,.8);

  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:100;
}

.window.hidden {
  display:none!important;
}

.window.maximized {
  top:0!important;
  left:0!important;
  width:100vw!important;
  height:calc(100dvh - 75px)!important;
  max-width:100vw!important;
  max-height:calc(100dvh - 75px)!important;
  border-radius:0;
}

/* ================= HEADER / DRAG ================= */

.window-header {
  height:52px;
  min-height:52px;

  padding:0 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(255,255,255,.08);
  border-bottom:1px solid var(--card-border);

  cursor:move;

  touch-action:none;
  -webkit-touch-action:none;

  user-select:none;
  -webkit-user-select:none;
}

.window-title {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:600;
  pointer-events:none;
}

.window-controls {
  display:flex;
  gap:5px;
}

.control-btn {
  width:38px;
  height:34px;

  border:0;
  border-radius:5px;

  background:transparent;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.control-btn:active {
  background:rgba(255,255,255,.2);
}

.control-btn.close:active {
  background:#e81123;
}

/* ================= BODY ================= */

.window-body {
  flex:1;
  padding:14px;

  overflow-y:auto;

  user-select:text;
  -webkit-user-select:text;

  touch-action:pan-y;
}

input,
textarea,
select {
  width:100%;
  padding:10px 12px;

  background:rgba(0,0,0,.45);
  border:1px solid var(--card-border);

  border-radius:6px;

  color:white;
  outline:none;

  user-select:text;
  -webkit-user-select:text;
}

input:focus,
textarea:focus,
select:focus {
  border-color:var(--accent);
}

label {
  display:block;
  margin-bottom:5px;

  font-size:12px;
  color:var(--text-muted);
}

.form-group {
  margin-bottom:14px;
}

.btn-primary {
  border:0;
  border-radius:6px;

  padding:10px 14px;

  background:var(--accent);
  color:white;

  font-weight:600;

  cursor:pointer;
}

/* ================= CALENDAR ================= */

.cal-header {
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.cal-grid {
  display:grid!important;
  grid-template-columns:repeat(7,1fr)!important;

  gap:4px;

  background:rgba(0,0,0,.3);
  padding:6px;

  border-radius:8px;
}

.cal-cell-header {
  text-align:center;

  font-size:12px;
  color:#94a3b8;

  font-weight:700;

  padding:6px 0;
}

.cal-cell {
  min-height:55px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:6px;

  padding:4px;

  cursor:pointer;

  overflow:hidden;
}

.cal-cell:active {
  transform:scale(.97);
  background:rgba(0,120,212,.35);
}

.cal-cell.empty {
  background:transparent;
  border:0;
  cursor:default;
}

.cal-cell.today {
  border:2px solid var(--accent);
  background:rgba(0,120,212,.25);
}

.date-num {
  font-size:11px;
  font-weight:700;
  margin-bottom:3px;
}

.cal-event-pill {
  font-size:9px;

  background:#0e639c;
  color:white;

  padding:2px 4px;

  border-radius:3px;

  margin-bottom:2px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cal-event-pill.ai-gen {
  background:#8b5cf6;
}

/* ================= TODAY ================= */

.today-panel {
  background:rgba(0,0,0,.35);

  border:1px solid var(--card-border);

  border-radius:8px;

  padding:10px 12px;

  margin-bottom:14px;
}

.event-card {
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(255,255,255,.06);

  border:1px solid rgba(255,255,255,.1);

  border-radius:6px;

  padding:8px 10px;

  margin-top:6px;
}

.event-left {
  display:flex;
  align-items:center;
  gap:8px;
}

.badge {
  font-size:10px;
  padding:2px 6px;
  border-radius:4px;
  font-weight:600;
}

.badge-user {
  background:#0078d4;
}

.badge-ai {
  background:#8b5cf6;
}

/* ================= TASKBAR ================= */

#taskbar {
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  height:64px;

  background:var(--taskbar-bg);

  border-top:2px solid var(--win-border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  z-index:999999;

  box-shadow:0 -4px 20px rgba(0,0,0,.6);
}

.taskbar-center {
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  gap:12px;
}

.taskbar-btn {
  width:46px;
  height:46px;

  border-radius:10px;

  border:1px solid rgba(255,255,255,.15);

  background:rgba(255,255,255,.08);

  color:white;

  cursor:pointer;

  font-size:20px;
}

.taskbar-btn.active {
  border-bottom:3px solid var(--accent);
}

.taskbar-right {
  margin-left:auto;

  text-align:right;
  font-size:11px;
}

/* ================= MOBILE ================= */

@media(max-width:600px) {

  .window {
    width:94vw!important;

    /*
      중요:
      left:3vw!important 를 넣으면
      드래그할 때 JS가 바꾼 left가 무시됨.
    */
  }

  .taskbar-right {
    display:none;
  }
}
</style>
</head>

<body>

<!-- ================= DESKTOP ================= -->

<div id="desktop">

  <div class="desktop-icon" onclick="openWindow('win-calendar')">

    <div class="icon-box"
      style="background:linear-gradient(135deg,#0078d4,#00b4d8);">

      📅

    </div>

    <span>전체 캘린더</span>

  </div>


  <div class="desktop-icon" onclick="openWindow('win-manual')">

    <div class="icon-box"
      style="background:linear-gradient(135deg,#10b981,#059669);">

      ➕

    </div>

    <span>일정 추가</span>

  </div>

</div>


<!-- ================= CALENDAR WINDOW ================= -->

<div id="win-calendar"
     class="window hidden"
     style="top:20px;left:24px;">

  <div class="window-header">

    <div class="window-title">
      📅
      <span>전체 캘린더</span>
    </div>

    <div class="window-controls">

      <button class="control-btn"
              onclick="minimizeWindow('win-calendar')">
        ─
      </button>

      <button class="control-btn"
              onclick="maximizeWindow('win-calendar')">
        □
      </button>

      <button class="control-btn close"
              onclick="closeWindow('win-calendar')">
        ✕
      </button>

    </div>

  </div>


  <div class="window-body">

    <div class="today-panel">

      <div style="display:flex;justify-content:space-between;">

        <h4 style="font-size:13px;">
          오늘 할 일
          (<span id="today-date-text"></span>)
        </h4>

        <span id="today-count"
              style="font-size:11px;color:var(--text-muted);">
          0개 일정
        </span>

      </div>

      <div id="today-task-list"></div>

    </div>


    <div class="cal-header">

      <h3 id="current-month-label">
        2026년 8월
      </h3>

      <div style="display:flex;gap:4px;">

        <button class="control-btn"
                onclick="changeMonth(-1)">
          ‹
        </button>

        <button class="control-btn"
                onclick="resetToday()">
          ●
        </button>

        <button class="control-btn"
                onclick="changeMonth(1)">
          ›
        </button>

      </div>

    </div>


    <div id="cal-grid-container"
         class="cal-grid">
    </div>

  </div>

</div>


<!-- ================= MANUAL WINDOW ================= -->

<div id="win-manual"
     class="window hidden"
     style="top:40px;left:50px;width:380px;height:440px;">

  <div class="window-header">

    <div class="window-title">
      📅
      <span>일정 추가</span>
    </div>

    <div class="window-controls">

      <button class="control-btn"
              onclick="minimizeWindow('win-manual')">
        ─
      </button>

      <button class="control-btn"
              onclick="maximizeWindow('win-manual')">
        □
      </button>

      <button class="control-btn close"
              onclick="closeWindow('win-manual')">
        ✕
      </button>

    </div>

  </div>


  <div class="window-body">

    <form onsubmit="handleManualAdd(event)">

      <div class="form-group">

        <label>일정 제목</label>

        <input id="manual-title"
               type="text"
               placeholder="일정 이름"
               required>

      </div>


      <div class="form-group">

        <label>날짜</label>

        <input id="manual-date"
               type="date"
               required>

      </div>


      <div class="form-group">

        <label>시간</label>

        <input id="manual-time"
               type="time"
               required>

      </div>


      <div class="form-group">

        <label>메모</label>

        <input id="manual-desc"
               type="text"
               placeholder="상세 내용">

      </div>


      <button class="btn-primary"
              type="submit"
              style="width:100%;">

        ＋ 일정 등록하기

      </button>

    </form>

  </div>

</div>


<!-- ================= TASKBAR ================= -->

<div id="taskbar">

  <button class="taskbar-btn">
    ☰
  </button>

  <div class="taskbar-center">

    <button id="task-win-calendar"
            class="taskbar-btn"
            onclick="toggleWindow('win-calendar')">
      📅
    </button>

    <button id="task-win-manual"
            class="taskbar-btn"
            onclick="toggleWindow('win-manual')">
      ➕
    </button>

  </div>

  <div class="taskbar-right">

    <div id="tb-time">
      오후 12:00
    </div>

    <div id="tb-date">
      2026-08-22
    </div>

  </div>

</div>


<script>

/* =====================================================
   일정 데이터
===================================================== */

let currentEvents =
  JSON.parse(
    localStorage.getItem("win11_cal_events") || "[]"
  );

let currentNavDate = new Date();

let topZ = 200;


/* =====================================================
   창 열기
===================================================== */

function openWindow(id) {

  const win = document.getElementById(id);

  if (!win) return;

  win.classList.remove("hidden");

  topZ++;

  win.style.zIndex = topZ;

  updateTaskbar();

  if (id === "win-calendar") {

    renderCalendar();

    renderTodayTasks();

  }

}


/* =====================================================
   창 닫기
===================================================== */

function closeWindow(id) {

  const win = document.getElementById(id);

  if (!win) return;

  win.classList.add("hidden");

  updateTaskbar();

}


function minimizeWindow(id) {

  closeWindow(id);

}


function maximizeWindow(id) {

  const win =
    document.getElementById(id);

  if (!win) return;

  win.classList.toggle("maximized");

}


function toggleWindow(id) {

  const win =
    document.getElementById(id);

  if (!win) return;

  if (win.classList.contains("hidden")) {

    openWindow(id);

  } else {

    closeWindow(id);

  }

}


/* =====================================================
   TASKBAR
===================================================== */

function updateTaskbar() {

  const ids = [
    "win-calendar",
    "win-manual"
  ];

  ids.forEach(id => {

    const win =
      document.getElementById(id);

    const btn =
      document.getElementById(
        "task-" + id
      );

    if (win && btn) {

      btn.classList.toggle(
        "active",
        !win.classList.contains("hidden")
      );

    }

  });

}


/* =====================================================
   ★ 창 드래그
===================================================== */

function initWindows() {

  document
    .querySelectorAll(".window")
    .forEach(win => {

      const header =
        win.querySelector(".window-header");

      if (!header) return;

      let dragging = false;

      let startX = 0;
      let startY = 0;

      let startLeft = 0;
      let startTop = 0;

      let pointerId = null;


      win.addEventListener(
        "pointerdown",
        () => {

          topZ++;

          win.style.zIndex = topZ;

        }
      );


      header.addEventListener(
        "pointerdown",
        e => {

          if (
            e.target.closest(".control-btn")
          ) {
            return;
          }

          if (
            win.classList.contains("maximized")
          ) {
            return;
          }

          dragging = true;

          pointerId = e.pointerId;

          startX = e.clientX;
          startY = e.clientY;

          const rect =
            win.getBoundingClientRect();

          startLeft = rect.left;
          startTop = rect.top;

          topZ++;

          win.style.zIndex = topZ;

          e.preventDefault();

          try {
            header.setPointerCapture(pointerId);
          } catch {}

        }
      );


      header.addEventListener(
        "pointermove",
        e => {

          if (!dragging) return;

          e.preventDefault();

          const dx =
            e.clientX - startX;

          const dy =
            e.clientY - startY;

          let newLeft =
            startLeft + dx;

          let newTop =
            startTop + dy;


          const width =
            win.offsetWidth;


          newLeft =
            Math.max(
              -width + 60,
              Math.min(
                newLeft,
                window.innerWidth - 60
              )
            );


          newTop =
            Math.max(
              0,
              Math.min(
                newTop,
                window.innerHeight - 80
              )
            );


          win.style.left =
            newLeft + "px";

          win.style.top =
            newTop + "px";

        }
      );


      function stopDrag() {

        dragging = false;

        pointerId = null;

      }


      header.addEventListener(
        "pointerup",
        stopDrag
      );

      header.addEventListener(
        "pointercancel",
        stopDrag
      );

      header.addEventListener(
        "lostpointercapture",
        stopDrag
      );

    });

}


/* =====================================================
   ★ 날짜 클릭 → 해당 날짜 일정 추가
===================================================== */

function selectCalendarDate(dateKey) {

  /*
    일정 추가 창 열기
  */

  openWindow("win-manual");


  /*
    선택한 날짜를 자동으로 입력
  */

  const dateInput =
    document.getElementById(
      "manual-date"
    );


  if (dateInput) {

    dateInput.value =
      dateKey;

  }


  /*
    제목 입력칸으로 이동
  */

  setTimeout(() => {

    const titleInput =
      document.getElementById(
        "manual-title"
      );

    if (titleInput) {

      titleInput.focus();

    }

  }, 100);

}


/* =====================================================
   CALENDAR
===================================================== */

function renderCalendar() {

  const year =
    currentNavDate.getFullYear();

  const month =
    currentNavDate.getMonth();


  document.getElementById(
    "current-month-label"
  ).innerText =
    `${year}년 ${month + 1}월`;


  const grid =
    document.getElementById(
      "cal-grid-container"
    );


  grid.innerHTML = "";


  const days = [
    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"
  ];


  days.forEach(day => {

    const header =
      document.createElement("div");

    header.className =
      "cal-cell-header";

    header.innerText =
      day;

    grid.appendChild(header);

  });


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const lastDate =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const now =
    new Date();


  const todayStr =
    `${now.getFullYear()}-${String(
      now.getMonth() + 1
    ).padStart(2,"0")}-${String(
      now.getDate()
    ).padStart(2,"0")`;


  /*
    빈 칸
  */

  for (
    let i = 0;
    i < firstDay;
    i++
  ) {

    const empty =
      document.createElement("div");

    empty.className =
      "cal-cell empty";

    grid.appendChild(empty);

  }


  /*
    날짜
  */

  for (
    let day = 1;
    day <= lastDate;
    day++
  ) {

    const dateKey =
      `${year}-${String(
        month + 1
      ).padStart(2,"0")}-${String(
        day
      ).padStart(2,"0")`;


    const cell =
      document.createElement("div");


    cell.className =
      "cal-cell";


    if (
      dateKey === todayStr
    ) {

      cell.classList.add("today");

    }


    const dateNum =
      document.createElement("div");

    dateNum.className =
      "date-num";

    dateNum.innerText =
      day;

    cell.appendChild(dateNum);


    /*
      해당 날짜의 일정 가져오기
    */

    const events =
      currentEvents.filter(
        event =>
          event.date === dateKey
      );


    events.forEach(event => {

      const pill =
        document.createElement("div");

      pill.className =
        "cal-event-pill";


      if (event.isAI) {

        pill.classList.add(
          "ai-gen"
        );

      }


      pill.innerText =
        (
          event.time
            ? event.time + " "
            : ""
        ) +
        event.title;


      cell.appendChild(pill);

    });


    /*
      ★ 날짜를 누르면
      해당 날짜로 일정 추가
    */

    cell.addEventListener(
      "click",
      () => {

        selectCalendarDate(
          dateKey
        );

      }
    );


    grid.appendChild(cell);

  }

}


/* =====================================================
   TODAY
===================================================== */

function renderTodayTasks() {

  const now =
    new Date();


  const todayStr =
    `${now.getFullYear()}-${String(
      now.getMonth() + 1
    ).padStart(2,"0")}-${String(
      now.getDate()
    ).padStart(2,"0")`;


  document.getElementById(
    "today-date-text"
  ).innerText =
    todayStr;


  const events =
    currentEvents.filter(
      event =>
        event.date === todayStr
    );


  document.getElementById(
    "today-count"
  ).innerText =
    `${events.length}개 일정`;


  const list =
    document.getElementById(
      "today-task-list"
    );


  list.innerHTML = "";


  if (events.length === 0) {

    list.innerHTML =
      `<div style="
        font-size:12px;
        color:var(--text-muted);
        padding:8px 0;
      ">
        오늘 예정된 일정이 없습니다.
      </div>`;

    return;

  }


  events.forEach(event => {

    const card =
      document.createElement("div");

    card.className =
      "event-card";


    const left =
      document.createElement("div");

    left.className =
      "event-left";


    const badge =
      document.createElement("span");

    badge.className =
      "badge " +
      (
        event.isAI
          ? "badge-ai"
          : "badge-user"
      );

    badge.innerText =
      event.isAI
        ? "AI"
        : "일반";


    const info =
      document.createElement("div");


    const title =
      document.createElement("strong");

    title.style.fontSize =
      "13px";

    title.innerText =
      event.title;


    const detail =
      document.createElement("div");

    detail.style.fontSize =
      "11px";

    detail.style.color =
      "var(--text-muted)";

    detail.innerText =
      (
        event.time ||
        "종일"
      ) +
      (
        event.desc
          ? " • " + event.desc
          : ""
      );


    info.appendChild(title);
    info.appendChild(detail);

    left.appendChild(badge);
    left.appendChild(info);


    const del =
      document.createElement("button");

    del.className =
      "control-btn close";

    del.innerText =
      "✕";


    del.onclick =
      () => {

        deleteEvent(
          event.id
        );

      };


    card.appendChild(left);
    card.appendChild(del);

    list.appendChild(card);

  });

}


/* =====================================================
   일정 추가
===================================================== */

function handleManualAdd(e) {

  e.preventDefault();


  const title =
    document.getElementById(
      "manual-title"
    ).value.trim();


  const date =
    document.getElementById(
      "manual-date"
    ).value;


  const time =
    document.getElementById(
      "manual-time"
    ).value;


  const desc =
    document.getElementById(
      "manual-desc"
    ).value.trim();


  if (!title || !date) return;


  currentEvents.push({

    id:
      "event_" +
      Date.now(),

    title:title,

    date:date,

    time:time,

    desc:desc,

    isAI:false

  });


  localStorage.setItem(
    "win11_cal_events",
    JSON.stringify(
      currentEvents
    )
  );


  /*
    입력창 초기화
  */

  document.getElementById(
    "manual-title"
  ).value = "";

  document.getElementById(
    "manual-time"
  ).value = "";

  document.getElementById(
    "manual-desc"
  ).value = "";


  /*
    일정 추가 창 닫기
  */

  closeWindow(
    "win-manual"
  );


  /*
    캘린더 갱신
  */

  renderCalendar();

  renderTodayTasks();


  /*
    캘린더 창 열기
  */

  openWindow(
    "win-calendar"
  );

}


/* =====================================================
   일정 삭제
===================================================== */

function deleteEvent(id) {

  currentEvents =
    currentEvents.filter(
      event =>
        event.id !== id
    );


  localStorage.setItem(
    "win11_cal_events",
    JSON.stringify(
      currentEvents
    )
  );


  renderCalendar();

  renderTodayTasks();

}


/* =====================================================
   월 이동
===================================================== */

function changeMonth(delta) {

  currentNavDate.setMonth(
    currentNavDate.getMonth() + delta
  );

  renderCalendar();

}


/* =====================================================
   오늘
===================================================== */

function resetToday() {

  currentNavDate =
    new Date();

  renderCalendar();

}


/* =====================================================
   시계
===================================================== */

function updateClock() {

  const now =
    new Date();


  let hour =
    now.getHours();


  const minute =
    String(
      now.getMinutes()
    ).padStart(2,"0");


  const ampm =
    hour >= 12
      ? "오후"
      : "오전";


  hour =
    hour % 12 || 12;


  document.getElementById(
    "tb-time"
  ).innerText =
    `${ampm} ${hour}:${minute}`;


  document.getElementById(
    "tb-date"
  ).innerText =
    `${now.getFullYear()}-${String(
      now.getMonth()+1
    ).padStart(2,"0")}-${String(
      now.getDate()
    ).padStart(2,"0")`;

}


/* =====================================================
   시작
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    initWindows();

    renderCalendar();

    renderTodayTasks();

    updateClock();

    updateTaskbar();


    setInterval(
      updateClock,
      1000
    );


    /*
      처음 일정 추가 창을 열었을 때
      오늘 날짜를 기본값으로 설정
    */

    const now =
      new Date();


    document.getElementById(
      "manual-date"
    ).value =
      `${now.getFullYear()}-${String(
        now.getMonth()+1
      ).padStart(2,"0")}-${String(
        now.getDate()
      ).padStart(2,"0")`;

  }
);

</script>
